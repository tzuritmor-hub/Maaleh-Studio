const CourseFilter=({value,onChange,ids})=>ids.length<2?null:html`<div className="hscroll chips-row" role="group" aria-label="סינון לפי קורס"><button className=${'fchip'+(!value?' on':'')} aria-pressed=${!value} onClick=${()=>onChange('')}>הכול</button>${ids.map(id=>html`<button key=${id} className=${'fchip'+(value===id?' on':'')} aria-pressed=${value===id} onClick=${()=>onChange(value===id?'':id)}><i style=${{background:courseColor(id)}}></i>${courseName(id)}</button>`)}</div>`;
const courseIdsWith=items=>store.data.courses.slice().sort(courseSort).map(c=>c.id).filter(id=>items.some(x=>x.courseId===id));
const SumRow=({s,showCourse=true})=>html`<a className="ri" href=${'#summary-'+s.id}>${s.courseId?html`<${CBar} id=${s.courseId}/>`:null}<div className="tx"><span className="t1">${s.title}</span><span className="t2">${[showCourse&&courseName(s.courseId),fmt(s.date,'dmy'),s.draft&&'טיוטה'].filter(Boolean).join(' · ')}</span>${s.body&&html`<span className="t3">${stripHtml(s.body).slice(0,160)}</span>`}</div><${Chev}/></a>`;
function newSummaryFor(cid){const l=allLessons().filter(x=>x.date<=todayIso()&&x.status!=='בוטל'&&(!cid||x.courseId===cid)).pop();show('summaryEdit',{preset:l?{courseId:l.courseId,date:l.date,title:l.n?'שיעור '+l.n+': ':''}:{courseId:cid||''}})}
function Notebook(){
  const st=useStore();const[q,setQ]=useState('');const[cid,setCid]=useState(()=>lsGet('nb-c')||'');const[tag,setTag]=useState('');
  useEffect(()=>lsSet('nb-c',cid),[cid]);
  const all=st.data.summaries.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.updatedAt||'').localeCompare(a.updatedAt||''));
  const tags=[...new Set(all.flatMap(s=>tagsOf(s.tags)))].sort((a,b)=>a.localeCompare(b,'he'));
  const ql=q.trim().toLowerCase();
  const items=all.filter(s=>(!cid||s.courseId===cid)&&(!tag||tagsOf(s.tags).includes(tag))&&(!ql||(s.title+' '+stripHtml(s.body)+' '+(s.tags||'')).toLowerCase().includes(ql)));
  const last=allLessons().filter(x=>x.date<=todayIso()&&x.status!=='בוטל'&&(!cid||x.courseId===cid)).pop();
  const lastHas=last&&sumOfLesson(last).length;
  return html`<div className="screen">
    <${NavBar} title="מחברת"><button className="nbtn round" aria-label="סיכום חדש" onClick=${()=>newSummaryFor(cid)}><${Ic} n="plus"/></button><//>
    ${last&&!lastHas&&html`<div className="group"><button className="ri" onClick=${()=>newSummaryFor(cid)}><${CBar} id=${last.courseId}/><span className="ic"><${Ic} n="pen"/></span><div className="tx"><span className="t1" style=${{color:'var(--accent)'}}>סיכום לשיעור האחרון</span><span className="t2">${courseName(last.courseId)} · ${fmt(last.date,'long')}</span></div><${Chev}/></button></div>`}
    <div className="search"><${Ic} n="search"/><input className="inp" id="nb-q" type="search" placeholder="חיפוש בכל הסיכומים" value=${q} onInput=${e=>setQ(e.target.value)}/></div>
    <${CourseFilter} value=${cid} onChange=${setCid} ids=${courseIdsWith(st.data.summaries)}/>
    ${tags.length>0&&html`<div className="hscroll chips-row" role="group" aria-label="תגיות">${tags.map(x=>html`<button key=${x} className=${'fchip'+(tag===x?' on':'')} aria-pressed=${tag===x} onClick=${()=>setTag(tag===x?'':x)}>#${x}</button>`)}</div>`}
    ${items.length?html`<div className="group">${items.map(s=>html`<${SumRow} key=${s.id} s=${s} showCourse=${!cid}/>`)}</div>`
      :html`<p className="empty" style=${{padding:'0 4px'}}>${all.length?'לא נמצאו סיכומים.':'עוד אין סיכומים. הכפתור + למעלה פותח סיכום לשיעור האחרון.'}</p>`}
  </div>`;
}
function SummaryPage({id}){
  const st=useStore();const s=byId('summaries',id);
  if(!s)return html`<div className="screen"><${NavBar} title=${st.mode==='db'&&st.fresh.size<COLS.length?'טוען…':'הסיכום לא נמצא'} back="notebook" backLabel="מחברת"/></div>`;
  const terms=st.data.terms.filter(t=>t.summaryId===id);
  const l=allLessons().find(x=>x.courseId===s.courseId&&x.date===s.date);
  return html`<div className="screen">
    <${NavBar} title=${s.title} back="notebook" backLabel="מחברת"><button className="nbtn" onClick=${()=>show('summaryEdit',{s})}>עריכה</button><//>
    <div className="fhero">${s.courseId&&html`<${CBar} id=${s.courseId}/>`}<div className="body">
      <h1>${s.title}</h1>
      <div className="small muted">${fmt(s.date,'full')}</div>
      <div className="row" style=${{gap:'6px',marginTop:'4px'}}><${CPill} id=${s.courseId}/>${s.draft&&html`<span className="chip warn">טיוטה</span>`}<${Tags} s=${s.tags}/></div>
    </div></div>
    ${stripHtml(s.body).trim()?html`<div className="card prose" dangerouslySetInnerHTML=${{__html:sanitize(s.body)}}></div>`:html`<p className="empty" style=${{padding:'0 4px'}}>הסיכום ריק. <b>עריכה</b> למעלה פותחת אותו לכתיבה.</p>`}
    ${(l||s.url||(s.attachments||[]).length>0)&&html`<div className="group">
      ${l&&html`<a className="ri" href=${'#'+lessonHash(l)}><span className="ic"><${Ic} n="calendar"/></span><div className="tx"><span className="t1">השיעור עצמו</span><span className="t2">${l.n?'שיעור '+l.n+' · ':''}${fmt(l.date,'long')}</span></div><${Chev}/></a>`}
      ${s.url&&html`<a className="ri" href=${s.url} target="_blank" rel="noopener"><span className="ic"><${Ic} n=${isDrive(s.url)?'drive':'ext'}/></span><div className="tx"><span className="t1">${isDrive(s.url)?'המקור ב־Drive':'קישור למקור'}</span></div><svg className="chev" viewBox="0 0 24 24"><path d=${P.ext}/></svg></a>`}
      ${(s.attachments||[]).map((a,i)=>html`<a key=${i} className="ri" href=${a.url} target="_blank" rel="noopener"><span className="ic"><${Ic} n="clip"/></span><div className="tx"><span className="t1">${a.name}</span><span className="t2">קובץ מצורף</span></div><svg className="chev" viewBox="0 0 24 24"><path d=${P.ext}/></svg></a>`)}
    </div>`}
    <${SH} title="מושגים מהסיכום"/>
    <div className="group">
      ${terms.map(t=>html`<button key=${t.id} className="ri" onClick=${()=>editTerm(t)}><div className="tx"><span className="t1">${t.term}</span><span className="t2">${t.definition}</span></div><${Chev}/></button>`)}
      <button className="ri" onClick=${()=>editTerm({courseId:s.courseId,summaryId:id})}><span className="ic"><${Ic} n="plus"/></span><div className="tx"><span className="t1" style=${{color:'var(--accent)'}}>הוספת מושג למילון</span></div></button>
    </div>
    <div><${DeleteBtn} label="מחיקת הסיכום" onDelete=${async()=>{await removeDoc('summaries',id);toast('הסיכום נמחק');go('notebook')}}/></div>
  </div>`;
}
const openA=a=>go('assignment-'+a.id);
function dueLabel(a){const t=todayIso();if(!a.due)return'בלי מועד';const late=a.due<t&&a.status!=='הוגש';const r=relDay(a.due);return (late?'באיחור · ':'')+(a.status==='הוגש'?fmt(a.due):r+(r!==fmt(a.due)?' · '+fmt(a.due):''))}
const cycleA=a=>{const i=A_STATUS.indexOf(a.status);saveDoc('assignments',a.id,{...a,status:A_STATUS[(i+1)%A_STATUS.length]})};
const ARow=({a,showCourse=true})=>{const late=a.due&&a.due<todayIso()&&a.status!=='הוגש';return html`<div className="ri">${a.courseId?html`<${CBar} id=${a.courseId}/>`:null}<a className="tx" href=${'#assignment-'+a.id}><span className="t1">${a.priority==='גבוהה'?'❗ ':''}${a.title}</span><span className=${'t2'+(late?' late':'')}>${[showCourse&&courseName(a.courseId),dueLabel(a),a.delivery].filter(Boolean).join(' · ')}</span></a><button className=${'chip status-btn '+statusChip(a.status)} title="לחיצה מעבירה לסטטוס הבא" onClick=${()=>cycleA(a)}>${a.status}</button></div>`};
function Assignments(){
  const st=useStore();const t=todayIso();const[f,setF]=useState(()=>lsGet('as-f')==='done'?'done':'open');const[cid,setCid]=useState('');
  useEffect(()=>lsSet('as-f',f),[f]);
  const byDue=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999');
  const base=st.data.assignments.filter(a=>!cid||a.courseId===cid);
  const open=base.filter(a=>a.status!=='הוגש').sort(byDue);const done=base.filter(a=>a.status==='הוגש').sort((a,b)=>(b.due||'').localeCompare(a.due||''));
  const wk=addDays(t,7);
  const groups=f==='open'?[['באיחור',open.filter(a=>a.due&&a.due<t)],['בשבוע הקרוב',open.filter(a=>a.due&&a.due>=t&&a.due<=wk)],['בהמשך',open.filter(a=>a.due&&a.due>wk)],['בלי מועד',open.filter(a=>!a.due)],['הוגשו לאחרונה',done.filter(a=>a.due&&a.due>=addDays(t,-14))]]:[['הוגשו',done]];
  return html`<div className="screen">
    <${NavBar} title="מטלות" back="more" backLabel="עוד"><button className="nbtn round" aria-label="מטלה חדשה" onClick=${()=>editAssignment(null,cid?{courseId:cid}:{})}><${Ic} n="plus"/></button><//>
    <div className="segc" role="tablist" aria-label="מצב"><button role="tab" aria-selected=${f==='open'} onClick=${()=>setF('open')}>פתוחות<span className="fcount">${open.length}</span></button><button role="tab" aria-selected=${f==='done'} onClick=${()=>setF('done')}>הוגשו<span className="fcount">${done.length}</span></button></div>
    <${CourseFilter} value=${cid} onChange=${setCid} ids=${courseIdsWith(st.data.assignments)}/>
    ${groups.filter(g=>g[1].length).map(([g,xs])=>html`<${Fragment} key=${g}><${SH} title=${g+' · '+xs.length}/><div className="group">${xs.map(a=>html`<${ARow} key=${a.id} a=${a} showCourse=${!cid}/>`)}</div><//>`)}
    ${!(f==='open'?open:done).length&&html`<p className="empty" style=${{padding:'0 4px'}}>${f==='open'?'אין מטלות פתוחות.':'עוד לא הוגשו מטלות.'}</p>`}
    <p className="xs muted" style=${{padding:'0 4px'}}>לחיצה על הסטטוס מעבירה אותו לשלב הבא. מטלה חדשה מקבלת כברירת מחדל את השיעור הבא בקורס כמועד הגשה.</p>
  </div>`;
}
function AssignmentPage({id}){
  const st=useStore();const a=byId('assignments',id);
  if(!a)return html`<div className="screen"><${NavBar} title=${st.mode==='db'&&st.fresh.size<COLS.length?'טוען…':'המטלה לא נמצאה'} back="assignments" backLabel="מטלות"/></div>`;
  const c=byId('courses',a.courseId);const t=todayIso();const late=a.due&&a.due<t&&a.status!=='הוגש';
  const upd=p=>saveDoc('assignments',id,{...a,...p});
  const lesson=a.due&&allLessons().find(l=>l.courseId===a.courseId&&l.date===a.due);
  return html`<div className="screen">
    <${NavBar} title="מטלה" back="assignments" backLabel="מטלות"><button className="nbtn" onClick=${()=>editAssignment(a)}>עריכה</button><//>
    <div className="fhero">${a.courseId&&html`<${CBar} id=${a.courseId}/>`}<div className="body">
      <h1>${a.title}</h1>
      <div className=${'small '+(late?'':'muted')} style=${late?{color:'var(--warn)',fontWeight:600}:null}>${a.due?(late?'באיחור · ':'')+'הגשה '+fmt(a.due,'full'):'בלי מועד הגשה'}</div>
      <div className="row" style=${{gap:'6px',marginTop:'4px'}}><${CPill} id=${a.courseId}/>${a.priority==='גבוהה'&&html`<span className="chip acc">עדיפות גבוהה</span>`}</div>
    </div></div>
    <div className="segc" role="group" aria-label="סטטוס">${A_STATUS.map(s=>html`<button key=${s} aria-pressed=${a.status===s} onClick=${()=>upd({status:s})}>${s}</button>`)}</div>
    ${c&&c.submitNote&&a.status!=='הוגש'&&html`<div className="bring"><${Ic} n="check"/><span>${c.submitNote}</span></div>`}
    <div className="group">
      <button className="ri" onClick=${()=>editAssignment(a)}><span className="ic"><${Ic} n="tasks"/></span><div className="tx"><span className="t1">אופן הגשה</span><span className="t2">${a.delivery||'לא צוין'}</span></div><${Chev}/></button>
      ${lesson&&html`<a className="ri" href=${'#'+lessonHash(lesson)}><span className="ic"><${Ic} n="calendar"/></span><div className="tx"><span className="t1">שיעור ההגשה</span><span className="t2">${lesson.n?'שיעור '+lesson.n+' · ':''}${fmt(lesson.date,'long')}</span></div><${Chev}/></a>`}
      ${a.url?html`<a className="ri" href=${a.url} target="_blank" rel="noopener"><span className="ic"><${Ic} n=${isDrive(a.url)?'drive':'files'}/></span><div className="tx"><span className="t1">קובץ העבודה</span><span className="t2">${isDrive(a.url)?'פתיחה ב־Drive':'פתיחה'}</span></div><svg className="chev" viewBox="0 0 24 24"><path d=${P.ext}/></svg></a>`
        :html`<button className="ri" onClick=${()=>editAssignment(a)}><span className="ic"><${Ic} n="plus"/></span><div className="tx"><span className="t1" style=${{color:'var(--accent)'}}>קישור לקובץ העבודה</span></div></button>`}
    </div>
    ${a.notes&&html`<${Fragment}><${SH} title="תיאור"/><div className="card" style=${{whiteSpace:'pre-wrap'}}>${a.notes}</div><//>`}
    <${SH} title="משוב המרצה"/>
    ${a.feedback?html`<div className="card" style=${{whiteSpace:'pre-wrap'}}>${a.feedback}</div>`
      :html`<div className="group"><button className="ri" onClick=${()=>editAssignment(a)}><span className="ic"><${Ic} n="plus"/></span><div className="tx"><span className="t1" style=${{color:'var(--accent)'}}>הוספת משוב</span><span className="t2">כשהמטלה חוזרת עם הערות</span></div></button></div>`}
  </div>`;
}

/* ───────── films: two boxes (watched / to watch) + film page ───────── */
const filmMeta=f=>[f.director,f.genre].filter(Boolean).join(' · ');
const WhyChip=({f})=>f.why==='חובה'?html`<span className="why must">חובה</span>`:f.why==='המלצה'?html`<span className="why rec">המלצה</span>`:null;
async function markWatched(f){const ok=await saveDoc('films',f.id,{...f,status:'נצפה',watched:f.watched||todayIso()});if(ok){toast('עבר לארגז "צפיתי". אפשר להוסיף עכשיו מידע');go('film-'+f.id)}}
function FilmCard({f,box}){
  const body=box==='seen'
    ?(f.insights?html`<span className="fq">${f.insights}</span>`:f.synopsis?html`<span className="fs">${f.synopsis}</span>`:html`<span className="fs faint">עוד אין מידע. לחיצה פותחת את הסרט להוספה.</span>`)
    :(f.recBy?html`<span className="fs">${f.recBy}</span>`:f.status==='צפיתי בחלק'&&f.insights?html`<span className="fs">${f.insights}</span>`:f.notes?html`<span className="fs">${f.notes}</span>`:null);
  return html`<div className="fcard">
    ${f.courseId?html`<${CBar} id=${f.courseId}/>`:null}
    <a className="fb" href=${'#film-'+f.id} style=${{textDecoration:'none',color:'inherit'}}>
      <span className="ft">${f.title}${f.year?html` <span className="y">${f.year}</span>`:''}</span>
      ${filmMeta(f)&&html`<span className="fm">${filmMeta(f)}</span>`}
      ${body}
      <span className="fx">
        ${box!=='seen'&&html`<${WhyChip} f=${f}/>`}
        ${f.courseId&&html`<${CPill} id=${f.courseId}/>`}
        ${f.rating?html`<${Stars} value=${f.rating}/>`:null}
        ${box==='seen'&&f.watched&&html`<span className="xs muted num">נצפה ${fmt(f.watched,'dmy')}</span>`}
      </span>
    </a>
    ${box==='todo'&&html`<div className="act">
      <button className="btn sm" onClick=${()=>markWatched(f)}><${Ic} n="check"/>צפיתי</button>
      ${!f.why&&f.status==='לצפייה'&&html`<span className="row" style=${{gap:'4px'}}><button className="btn sm ghost" onClick=${()=>saveDoc('films',f.id,{...f,why:'חובה'})}>חובה</button><button className="btn sm ghost" onClick=${()=>saveDoc('films',f.id,{...f,why:'המלצה'})}>המלצה</button></span>`}
    </div>`}
    ${box==='unknown'&&html`<div className="act"><button className="btn sm" onClick=${()=>markWatched(f)}>ראיתי</button><button className="btn sm ghost" onClick=${()=>saveDoc('films',f.id,{...f,status:'לצפייה'})}>עוד לא</button></div>`}
  </div>`;
}
function Films(){
  const st=useStore();const[box,setBox]=useState(()=>lsGet('film-box')==='todo'?'todo':'seen');const[q,setQ]=useState('');
  useEffect(()=>lsSet('film-box',box),[box]);
  const ql=q.trim().toLowerCase();
  const match=f=>!ql||[f.title,f.director,f.genre,f.synopsis,f.insights,f.notes,f.themes,f.tags,f.recBy,courseName(f.courseId)].join(' ').toLowerCase().includes(ql);
  const all=st.data.films.filter(match);
  const byT=(a,b)=>(a.title||'').localeCompare(b.title||'','he');
  const seen=all.filter(f=>f.status==='נצפה').sort((a,b)=>(b.watched||'').localeCompare(a.watched||'')||(a.year||0)-(b.year||0)||byT(a,b));
  const partial=all.filter(f=>f.status==='צפיתי בחלק').sort(byT);
  const todo=all.filter(f=>f.status==='לצפייה'||!f.status);
  const must=todo.filter(f=>f.why==='חובה').sort(byT),rec=todo.filter(f=>f.why==='המלצה').sort(byT),none=todo.filter(f=>f.why!=='חובה'&&f.why!=='המלצה').sort(byT);
  const unknown=all.filter(f=>f.status==='לא ידוע').sort(byT);
  const nTodo=partial.length+todo.length+unknown.length;
  const Sec=(title,items,kind,hint)=>items.length?html`<${Fragment} key=${title}><${SH} title=${title+' · '+items.length}/>${hint&&html`<p className="xs muted" style=${{padding:'0 4px',marginBottom:'-8px'}}>${hint}</p>`}<div className="fbox">${items.map(f=>html`<${FilmCard} key=${f.id} f=${f} box=${kind}/>`)}</div><//>`:null;
  return html`<div className="screen">
    <${NavBar} title="סרטים" back="more" backLabel="עוד"><button className="nbtn round" aria-label="סרט חדש" onClick=${()=>editFilm(null,box==='seen'?{status:'נצפה',watched:todayIso()}:{status:'לצפייה'})}><${Ic} n="plus"/></button><//>
    <div className="segc" role="tablist" aria-label="ארגז">
      <button role="tab" aria-selected=${box==='seen'} onClick=${()=>setBox('seen')}>צפיתי<span className="fcount">${seen.length}</span></button>
      <button role="tab" aria-selected=${box==='todo'} onClick=${()=>setBox('todo')}>לצפייה<span className="fcount">${nTodo}</span></button>
    </div>
    <div className="search"><${Ic} n="search"/><input className="inp" type="search" id="fm-q" placeholder="חיפוש לפי שם, במאי או מה חשבתי" value=${q} onInput=${e=>setQ(e.target.value)}/></div>
    ${box==='seen'?html`<${Fragment}>
      ${seen.length?html`<div className="fbox">${seen.map(f=>html`<${FilmCard} key=${f.id} f=${f} box="seen"/>`)}</div>`:html`<p className="empty">${ql?'לא נמצאו סרטים.':'עוד אין כאן סרטים. כשמסמנים סרט כ״צפיתי״ הוא עובר לכאן.'}</p>`}
      <div className="group"><button className="ri" onClick=${()=>editFilm(null,{status:'נצפה',watched:todayIso()})}><span className="ic"><${Ic} n="plus"/></span><div className="tx"><span className="t1" style=${{color:'var(--accent)'}}>סרט שצפיתי בו</span></div></button></div>
    <//>`:html`<${Fragment}>
      ${Sec('להשלים צפייה',partial,'todo','צפית בחלק מהסרט')}
      ${Sec('חובה',must,'todo')}
      ${Sec('המלצה',rec,'todo')}
      ${Sec('עוד לא סווג',none,'todo','בחרי חובה או המלצה')}
      ${Sec('לא בטוח אם ראיתי',unknown,'unknown')}
      ${!nTodo&&html`<p className="empty">${ql?'לא נמצאו סרטים.':'אין סרטים לצפייה.'}</p>`}
      <div className="group">
        <button className="ri" onClick=${()=>editFilm(null,{status:'לצפייה',why:'חובה'})}><span className="ic"><${Ic} n="plus"/></span><div className="tx"><span className="t1" style=${{color:'var(--accent)'}}>סרט חובה</span><span className="t2">למשל לקראת שיעור או מטלה</span></div></button>
        <button className="ri" onClick=${()=>editFilm(null,{status:'לצפייה',why:'המלצה'})}><span className="ic"><${Ic} n="plus"/></span><div className="tx"><span className="t1" style=${{color:'var(--accent)'}}>המלצה</span><span className="t2">ממרצה, מחבר או מכל מקום</span></div></button>
      </div>
    <//>`}
  </div>`;
}
function FilmPage({id}){
  const st=useStore();const f=byId('films',id);

function DriveConnect({onDone}){
  const st=useStore();const cfg=driveCfg();
  const[link,setLink]=useState(cfg&&cfg.rootUrl||'');const[msg,setMsg]=useState('');const[folders,setFolders]=useState(null);const[busy,setBusy]=useState(false);
  const save=async(id,title,url)=>{setBusy(true);setMsg('בודק גישה לתיקייה…');
    try{const p=await gd('get_file_metadata',{fileId:id,excludeContentSnippets:true});
      if(!p||p.mimeType!==FOLDER_MIME){setMsg('הקישור לא מוביל לתיקייה. הדביקי קישור של תיקייה מ־Drive.');setBusy(false);return}
      await saveDoc('driveConfig','main',{...(driveCfg()||{}),rootId:id,rootTitle:p.title||title||'',rootUrl:url||p.viewUrl||'',connectedAt:new Date().toISOString(),lastError:''});
      setMsg('');setBusy(false);onDone&&onDone();runDriveSync(true);
    }catch(e){setMsg(mcpMsg(e));setBusy(false)}};
  const fromLink=()=>{const id=driveIdFromUrl(link)||(/^[A-Za-z0-9_-]{20,}$/.test(link.trim())?link.trim():'');if(!id){setMsg('לא מצאתי מזהה תיקייה בקישור.');return}save(id,'',link.trim())};
  const browse=async()=>{setBusy(true);setMsg('');try{const p=await gd('search_files',{query:"mimeType = '"+FOLDER_MIME+"' and owner = 'me'",excludeContentSnippets:true,pageSize:50});setFolders(((p&&p.files)||[]).sort((a,b)=>(b.modifiedTime||'').localeCompare(a.modifiedTime||'')))}catch(e){setMsg(mcpMsg(e))}setBusy(false)};
  if(!st.drive.mcp)return html`<p className="small">החיבור לדרייב עובד רק כשהאפליקציה פתוחה בתוך Claude, עם מחבר Google Drive מחובר לחשבון.</p>`;
  return html`<div className="stack">
    <label className="f full" htmlFor="drv-link">קישור לתיקייה ב־Drive
      <span className="row"><input className="inp grow" id="drv-link" dir="ltr" placeholder="https://drive.google.com/drive/folders/…" value=${link} onInput=${e=>setLink(e.target.value)}/><button className="btn pri" disabled=${busy||!link.trim()} onClick=${fromLink}>חיבור</button></span>
      <span className="hint">התיקייה נשארת פרטית. הקריאה נעשית בהרשאות שלך דרך מחבר Google Drive, והאפליקציה לא משנה דבר בדרייב.</span></label>
    <div className="row"><button className="btn" disabled=${busy} onClick=${browse}>או בחירה מהתיקיות שלי</button></div>
    ${folders&&html`<div className="list" style=${{maxHeight:'260px',overflow:'auto'}}>${folders.length?folders.map(f=>html`<div key=${f.id} className="li"><span className="grow ttl">${normHe(f.title)}</span><button className="btn sm" disabled=${busy} onClick=${()=>save(f.id,f.title,f.viewUrl)}>בחירה</button></div>`):html`<p className="empty">לא נמצאו תיקיות.</p>`}</div>`}
    ${msg&&html`<p className="small">${msg}</p>`}
  </div>`;
}
function DrivePanel(){

  const r=cfg&&cfg.lastResult;
  if(!st.drive.ready)return null;
  return html`<div className="card stack">
    <div className="between"><h3 style=${{margin:0}}>תיקיית Google Drive</h3>
      ${cfg&&cfg.rootId&&!edit&&html`<div className="row"><button className="btn pri" disabled=${st.drive.running||!st.drive.mcp} onClick=${()=>runDriveSync(true)}><${Ic} n="sync"/>${st.drive.running?'מסנכרן…':'סנכרן עכשיו'}</button><button className="btn ghost sm" onClick=${()=>setEdit(true)}>החלפת תיקייה</button></div>`}</div>
    ${(!cfg||!cfg.rootId||edit)?html`<${DriveConnect} onDone=${()=>setEdit(false)}/>${edit&&html`<div><button className="btn sm ghost" onClick=${()=>setEdit(false)}>ביטול</button></div>`}`
    :html`<div className="small">
      <div>מחובר ל: <a href=${cfg.rootUrl||('https://drive.google.com/drive/folders/'+cfg.rootId)} target="_blank" rel="noopener">${normHe(cfg.rootTitle)||'התיקייה'}</a></div>
      <div className="muted">${cfg.lastSyncAt?'סנכרון אחרון: '+fmt(cfg.lastSyncAt.slice(0,10),'dmy')+' '+new Date(cfg.lastSyncAt).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}):'עוד לא סונכרן'}${r?' · '+r.total+' קבצים בתיקייה, '+r.added+' חדשים, '+r.updated+' עודכנו'+(r.missing?', '+r.missing+' נמחקו מהדרייב':'')+(r.textFail?', '+r.textFail+' לא נקראו':''):''}</div>
      <div className="muted xs">הסנכרון רץ כשפותחים את האפליקציה (אם עברו יותר מ־10 דקות) ובלחיצה על הכפתור. כשהאפליקציה סגורה אין סנכרון ברקע. הקלטות שמע מופיעות, אבל אי אפשר לחפש בתוכן שלהן.</div>

function Books(){
  const st=useStore();const[box,setBox]=useState(()=>lsGet('book-box')==='seen'?'seen':'todo');const[q,setQ]=useState('');
  useEffect(()=>lsSet('book-box',box),[box]);
  const ql=q.trim().toLowerCase();
  const all=st.data.books.filter(b=>!ql||[b.title,b.author,b.kind,b.synopsis,b.insights,b.notes,b.quotes,b.craft,b.tags,b.recBy,courseName(b.courseId)].join(' ').toLowerCase().includes(ql));
  const byT=(a,b)=>(a.title||'').localeCompare(b.title||'','he');
  const seen=all.filter(b=>b.status==='קראתי').sort((a,b)=>(b.readDate||'').localeCompare(a.readDate||'')||byT(a,b));
  const partial=all.filter(b=>b.status==='קראתי בחלק').sort(byT);
  const todo=all.filter(b=>b.status==='לקריאה'||!b.status);
  const must=todo.filter(b=>b.why==='חובה').sort(byT),rec=todo.filter(b=>b.why==='המלצה').sort(byT),none=todo.filter(b=>b.why!=='חובה'&&b.why!=='המלצה').sort(byT);

        <a href="#home" className="brand" style=${{textDecoration:'none',color:'inherit'}}>שולחן הכתיבה<small>תסריטאות שנה א׳ · מעלה · תשפ״ז</small></a>

        <nav className="nav" aria-label="ניווט ראשי">${NAV.map((n,i)=>n.grp?html`<div key=${'g'+i} className="grp">${n.grp}</div>`:html`<a key=${n.k} href=${'#'+n.k} aria-current=${cur===n.k?'page':undefined}><${Ic} n=${n.i}/>${n.l}</a>`)}</nav>
        <div className="store"><span className=${'dot '+storeLine[0]}></span><span>${storeLine[1]}</span></div>
      </aside>
      <main className="main">
        ${st.mode==='local'&&html`<div className="screen" style=${{marginBottom:'12px'}}><div className="banner"><span>המחברת פתוחה כאן בלי חיבור למאגר הקבוע, אז שינויים נשמרים רק בדפדפן הזה.</span><a className="btn sm" href="#data">פרטים</a></div></div>`}
        ${st.timedOut&&html`<div className="screen" style=${{marginBottom:'12px'}}><div className="banner"><span>הנתונים מתעכבים להגיע. אם זה נמשך, כדאי לרענן את הדף.</span></div></div>`}
        ${loading&&st.mode==='db'&&!st.data.courses.length?html`<div className="screen"><p className="muted">טוען את המחברת…</p></div>`:html`<div className=${'pagewrap'+(back?' back':'')} key=${location.hash||'#home'}>${page}</div>`}
      </main>
    </div>
    <nav className="tabbar" aria-label="ניווט">${TABS.map(([k,l,i])=>html`<a key=${k} href=${'#'+k} aria-current=${tab===k?'page':undefined}><${Ic} n=${i}/>${l}</a>`)}</nav>
    ${m}
    ${t&&html`<div className="toast" role="status">${t}</div>`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
initDrive();boot();
})();
</script>
