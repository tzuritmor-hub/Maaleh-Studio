<!doctype html><html lang="he" dir="rtl"><head><meta name="robots" content="noindex, nofollow"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>שולחן הכתיבה · מעלה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell. Sticky nav bar, inset grouped lists, bottom tab bar (sidebar from 900px). Cream ground, white cards, one bordeaux tint, a fixed colour per course. */
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --sunk:#EFEAE2; --ink:#242321; --muted:#6B665F; --faint:#99928A;
  --line:#E8E3DB; --line-strong:#D9D2C6; --accent:#762E3D; --accent-ink:#FFFFFF; --accent-soft:#F4E8E9;
  --sage:#A3AD9B; --sage-ink:#4C5746; --sage-soft:#E9EDE4; --warn:#94560F; --warn-soft:#F6EAD7; --danger:#A3263A;
  --bar:rgba(247,243,236,.86); --tab:rgba(255,255,255,.88);
  --shadow:0 1px 2px rgba(36,35,33,.05),0 10px 30px -14px rgba(36,35,33,.18);
  --cc-mix:100%; --cc-tint:11%; --cc-ink:78%;
  --display:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Assistant","Segoe UI",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --c1:#762E3D; --c2:#5E7356; --c3:#A07425; --c4:#46607A; --c5:#A0523A; --c6:#6A4A70; --c7:#6E6D35; --c8:#3B6C68;
  --r:14px;
}
:root[data-look="dark"]{
  --bg:#121110; --surface:#1E1C1A; --sunk:#2A2724; --ink:#F2EEE8; --muted:#ABA49A; --faint:#857E75;
  --line:#2F2C28; --line-strong:#423D37; --accent:#DC93A1; --accent-ink:#1A1214; --accent-soft:#3A2429;
  --sage:#A3AD9B; --sage-ink:#C5CEBB; --sage-soft:#26301F; --warn:#E3AA62; --warn-soft:#382B19; --danger:#F08A97;
  --bar:rgba(18,17,16,.84); --tab:rgba(30,28,26,.9);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
  --cc-mix:72%; --cc-tint:22%; --cc-ink:52%;
  --c1:#D58C9A; --c2:#9DB58F; --c3:#D9B067; --c4:#8FB0CF; --c5:#E09A7F; --c6:#B898C0; --c7:#C2C07A; --c8:#86BDB7;
  color-scheme:dark}
@media (prefers-color-scheme: dark){:root[data-look="system"]{
  --bg:#121110; --surface:#1E1C1A; --sunk:#2A2724; --ink:#F2EEE8; --muted:#ABA49A; --faint:#857E75;
  --line:#2F2C28; --line-strong:#423D37; --accent:#DC93A1; --accent-ink:#1A1214; --accent-soft:#3A2429;
  --sage:#A3AD9B; --sage-ink:#C5CEBB; --sage-soft:#26301F; --warn:#E3AA62; --warn-soft:#382B19; --danger:#F08A97;
  --bar:rgba(18,17,16,.84); --tab:rgba(30,28,26,.9);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
  --cc-mix:72%; --cc-tint:22%; --cc-ink:52%;
  --c1:#D58C9A; --c2:#9DB58F; --c3:#D9B067; --c4:#8FB0CF; --c5:#E09A7F; --c6:#B898C0; --c7:#C2C07A; --c8:#86BDB7;
  color-scheme:dark}}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.45rem} h3{font-size:1.15rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.875rem} .xs{font-size:.78rem}
.eyebrow{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;border-inline-start:0;border-inline-end:1px solid var(--line);padding:28px 18px 24px;display:flex;flex-direction:column;gap:22px;background:var(--bg)}
.brand{font-family:var(--display);font-size:1.45rem;font-weight:500;line-height:1.15}
.brand small{display:block;font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:400;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.97rem}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .grp{font-size:.74rem;color:var(--faint);letter-spacing:.06em;font-weight:600;padding:14px 10px 4px}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.store{margin-top:auto;font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px;background:var(--faint)}
.dot.ok{background:var(--sage)} .dot.warn{background:var(--warn)}
.main{min-width:0;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.topbar{display:none}
.bottom{display:none}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .brand{font-size:1.15rem}
  .main{padding-block:18px 110px}
  h1{font-size:1.6rem}
  .bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottom a,.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:.7rem;color:var(--muted);text-decoration:none;background:none;border:0}
  .bottom [aria-current="page"]{color:var(--accent);font-weight:600}
  .bottom svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
}

/* page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card.pad-s{padding:14px 16px}
.card h3{margin-bottom:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h3{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dash{display:grid;gap:16px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.dash{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0;padding-top:2px}
.li .grow{flex:1;min-width:0}
.li-btn{all:unset;cursor:pointer;display:block;width:100%;min-width:0}
.li-btn:hover .ttl{color:var(--accent)}
.ttl{font-weight:600;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);font-size:.93rem;padding:6px 0}
.empty b{color:var(--ink);font-weight:600}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:.93rem;line-height:1.3;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:#A3263A;border-color:currentColor}
.btn.sm{padding:4px 10px;font-size:.84rem}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp,select.inp,textarea.inp{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea.inp{min-height:90px;resize:vertical;line-height:1.55}
.filters .inp{width:auto}
.search{position:relative;flex:1;min-width:180px}
.search .inp{padding-inline-start:34px;width:100%}
.search svg{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:1.8}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--muted);font-weight:600;min-width:0}
label.f .inp{color:var(--ink);font-weight:400;font-size:1rem}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.hint{font-size:.8rem;color:var(--faint);font-weight:400}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;line-height:1.6}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.sage{background:var(--sage-soft);color:var(--sage-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.line{background:transparent;border:1px solid var(--line-strong)}
.cdot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.course-tag{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted);min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.status-btn{cursor:pointer;border:0}

/* dashboard specifics */
.hello{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.hello .date{font-family:var(--display);font-size:2.1rem;line-height:1.1}
.hello .heb{color:var(--muted);font-size:.95rem}
.slug{font-size:.82rem;letter-spacing:.05em;font-weight:600;color:var(--muted);direction:rtl}
.next{border-color:var(--line-strong);padding:24px}
.next .course{font-family:var(--display);font-size:1.7rem;line-height:1.2;margin:6px 0 4px}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.tl:first-child{border-top:0}
.tl .h{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.tl.cancel .grow{text-decoration:line-through;color:var(--faint)}
.tl.now .h{color:var(--accent);font-weight:700}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sage-ink);border-radius:99px}
.desk{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.desk .card{padding:16px}

/* calendar */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-inline-start:1px solid var(--line)}
.month .dh{font-size:.78rem;color:var(--muted);padding:6px 8px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:600}
.day{min-height:92px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:var(--surface);min-width:0;text-align:start;font:inherit;color:inherit;border-top:0;border-inline-start:0}
.day:hover{background:var(--sunk)}
.day.out{background:transparent;color:var(--faint)}
.day.hol{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--sunk) 6px 7px)}
.day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.dn{font-size:.82rem;font-variant-numeric:tabular-nums;align-self:flex-start}
.ev{font-size:.72rem;line-height:1.3;padding:1px 5px;border-radius:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:var(--sunk);color:var(--ink)}
.ev.lesson{background:transparent;padding:0;display:flex;gap:3px;flex-wrap:wrap}
.ev.hol{background:var(--sage-soft);color:var(--sage-ink)}
.ev.due{background:var(--accent-soft);color:var(--accent)}
.ev.mine{background:var(--warn-soft);color:var(--warn)}
@media (max-width:700px){.day{min-height:58px;padding:4px}.ev:not(.lesson){font-size:0;height:5px;padding:0}.month .dh{padding:4px}}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{min-width:0;display:flex;flex-direction:column;gap:6px}
.wcol .wh{font-size:.82rem;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
.wcol .wh b{display:block;font-size:1.05rem;color:var(--ink);font-weight:700}
.wcol.today .wh b{color:var(--accent)}
.wi{font-size:.82rem;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);cursor:pointer;text-align:start;width:100%;min-width:0}
.wi:hover{border-color:var(--line-strong)}
.wi .h{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.75rem}
.wi.cancel{text-decoration:line-through;opacity:.6}
@media (max-width:900px){.week{grid-template-columns:minmax(0,1fr)}.wcol .wh b{display:inline;margin-inline-end:6px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:.92rem;min-width:520px}
.tbl th,.tbl td{text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:.78rem;color:var(--muted);font-weight:600}
.tbl .h{font-variant-numeric:tabular-nums;white-space:nowrap}
.superseded{opacity:.75}

/* course */
.course-hero{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.meta{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:.95rem}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:.92rem}
.pend{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.pend .inp{width:auto;flex:0 1 190px;min-width:130px}
.note.sage{background:var(--sage-soft);color:var(--sage-ink)}
.lesson-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.lesson-row:first-child{border-top:0}
@media (max-width:600px){.lesson-row{grid-template-columns:minmax(0,1fr) auto}.lesson-row .d{grid-column:1/-1}}
.lesson-row.past .d b{color:var(--muted)}

/* reading */
.prose{max-width:68ch;font-size:1.05rem;line-height:1.75;overflow-wrap:anywhere}
.prose h2,.prose h3{margin:1.3em 0 .4em}
.prose h2{font-size:1.3rem}.prose h3{font-size:1.12rem}
.prose p,.prose ul,.prose ol,.prose blockquote{margin:0 0 .8em}
.prose ul,.prose ol{padding-inline-start:1.3em}
.prose blockquote{border-inline-start:3px solid var(--line-strong);padding-inline-start:14px;color:var(--muted)}
.prose>*:first-child{margin-top:0}
.film-ana dt{font-weight:700;font-size:.86rem;color:var(--muted);margin-top:12px}
.film-ana dd{margin:2px 0 0;white-space:pre-wrap}

/* editor */
.editor{border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);min-width:0}
.tb{display:flex;gap:2px;flex-wrap:wrap;padding:6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:8px 8px 0 0;z-index:1}
.tb button{border:0;background:transparent;border-radius:6px;padding:4px 9px;cursor:pointer;font-size:.88rem;min-width:32px}
.tb button:hover{background:var(--sunk)}
.tb .sep{width:1px;background:var(--line);margin:4px 4px}
.ce{min-height:260px;padding:14px 16px;outline:none}
.ce:empty::before{content:attr(data-ph);color:var(--faint)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,18,16,.42);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal{background:var(--bg);border:1px solid var(--line-strong);border-radius:14px;width:min(720px,100%);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:none}
.modal.wide{width:min(940px,100%)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mb{padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.mf{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.mf .r{display:flex;gap:8px;flex-wrap:wrap}
.x{border:0;background:none;cursor:pointer;font-size:1.4rem;line-height:1;color:var(--muted);padding:4px 8px;border-radius:6px}
.x:hover{background:var(--sunk);color:var(--ink)}

", "title": "ערב יום הזיכרון: לימודים עד 17:00", "type": "אירוע", "id": "erev-zikaron"}, {"date": "2026-10-19", "endDate": "", "notes": "ציון: 100", "origin": "mine", "title": "מבחן על 13 סרטי מטלת הקיץ", "type": "מועד", "id": "exam-13-films"}, {"date": "2026-10-12", "endDate": "", "notes": "", "origin": "official", "title": "יום גיבוש", "type": "אירוע", "id": "gibush"}, {"date": "2026-10-26", "end": "22:00", "endDate": "", "location": "קמפוס ניסן נתיב", "notes": "קמפוס ניסן נתיב, רח׳ מנורה 3. אירוע חד־פעמי לכל בית הספר.", "origin": "official", "start": "20:15", "title": "ערב חני: הקרנת סרטי לוקיישן שנה ב׳", "type": "הקרנה", "id": "location-screening-2610"}, {"date": "2027-04-19", "endDate": "2027-04-28", "notes": "", "origin": "official", "title": "חופשת פסח", "type": "חופשה", "id": "pesach"}, {"date": "2027-03-22", "endDate": "2027-03-24", "notes": "", "origin": "official", "title": "חופשת פורים", "type": "חופשה", "id": "purim"}, {"date": "2027-01-28", "endDate": "2027-02-14", "notes": "", "origin": "official", "title": "חופשת סמסטר", "type": "חופשה", "id": "sem-break"}, {"date": "2027-01-27", "endDate": "", "notes": "", "origin": "official", "title": "סיום סמסטר א׳", "type": "מועד", "id": "semA-end"}, {"date": "2026-10-26", "endDate": "", "notes": "", "origin": "official", "title": "פתיחת סמסטר א׳", "type": "תחילת סמסטר", "id": "semA-start"}, {"date": "2027-06-16", "endDate": "", "notes": "", "origin": "official", "title": "סיום סמסטר ב׳ ושנת הלימודים", "type": "מועד", "id": "semB-end"}, {"date": "2027-02-15", "endDate": "", "notes": "", "origin": "official", "title": "פתיחת סמסטר ב׳", "type": "תחילת סמסטר", "id": "semB-start"}, {"date": "2026-10-19", "endDate": "", "notes": "", "origin": "official", "title": "סמינריון פתיחה לתסריטאים", "type": "אירוע", "id": "seminar"}, {"date": "2027-06-07", "endDate": "", "notes": "", "origin": "official", "title": "שבוע ייעודי לתסריטאות / השלמות", "type": "אירוע", "id": "special-week"}, {"date": "2027-05-11", "endDate": "2027-05-12", "notes": "", "origin": "official", "title": "יום הזיכרון ויום העצמאות", "type": "חג", "id": "zikaron-atzmaut"}], "summaries": [{"attachments": [], "body": "<h3>חוקי יסוד בכתיבה תסריטאית<\/h3><p>תסריט נכתב תמיד בזמן הווה, כי הסרט קורה לצופה ברגע הצפייה.<\/p><p>תיאורי פעולה בגוף שלישי.<\/p><p>כותבים רק מה שרואים ושומעים. לא \"הוא הריח יסמין\", אלא פעולה או צליל.<\/p><h3>מי קורא את התסריט ואיך<\/h3><p>מפיקים: כותרות הסצנה (פנים/חוץ, מקום, יום/לילה) לתקציב וימי צילום.<\/p><p>צלמים: קוראים את התסריט כסרט שלם.<\/p><p>שחקנים: נוטים לקרוא בעיקר את הדיאלוג של הדמות שלהם.<\/p><p>ליהוק, הלבשה, איפור, סאונד: מחפשים את מה שנוגע למחלקה שלהם.<\/p><h3>דוגמאות<\/h3><p>הערת שוליים (יוסף סידר): משפטים קצרים וקטועים יוצרים אצל הקורא את התקיעות של הדמות. \"גבר כבן 70\" בלי שם, כדי לשמור על החידה.<\/p><p>Go (ג׳ון אוגוסט): פתיחה בצלילים ובאונומטופיאה, צרצרים מול מוזיקת מועדונים רחוקה.<\/p><h3>תפקיד התסריטאי<\/h3><p>לכתוב יצירה שלמה, בלי להשאיר חורים לבמאי.<\/p><p>תסריט טוב גורם לקורא לראות את הסרט.<\/p><p>מבחן 10 העמודים הראשונים.<\/p><p>לקרוא המון ולכתוב המון (סטיבן קינג).<\/p><h3>ההערות שלי<\/h3><p>יש סוג של מצלול כשכותבים תסריט. כותבים בהווה. הערות בימוי בגוף שלישי. כותבים מה שרואים.<\/p>", "courseId": "kriya", "date": "2026-10-26", "origin": "mine", "tags": "פורמט, קריאה", "title": "שיעור 1: איך לקרוא תסריט", "url": "https://docs.google.com/document/d/1SB2ZZQvNYD-BAdgYZzrkczphdRNXUUyNhG49qkO9Ie4/edit", "id": "kriya-1"}, {"attachments": [], "body": "<p>כתסריטאים אנחנו מייצרים עולם וצריכים להעביר מידע לקורא טיפין טיפין, בלי להציף. תמונה קשה להעביר במילים, <b>סאונד קל<\/b>. לכן הרבה תסריטים נפתחים בסאונד.<\/p><h3>פתיחת Go (ג׳ון אוגוסט), שלב אחרי שלב<\/h3><ul><li>ירח מלא, צרצרים, מוזיקה רחוקה. סאונד ראשון, ״זום אאוט״.<\/li><li>עוקבים אחרי זרזיף מים דרך אשפה (בלי לכתוב תנועת מצלמה) עד לגוף של אישה. שאלה מוקדמת. לענות עליה מהר, אחרת הקהל ימציא תשובות משלו.<\/li><li><b>אליטרציה:<\/b> ״18, black and bleeding״.<\/li><li>הצגת דמות ראשונה: שם, גיל, תיאור קצר.<\/li><li><b>דימוי מול מטאפורה:<\/b> ״מחייכת כאילו שמעה בדיחה״. דימוי טוב לתסריט כי הוא ספציפי ומפעיל שחקנית. מטאפורה טובה לשירה, לא לתסריט.<\/li><li>הטון: קומדיה שחורה. כואבים וצוחקים יחד. חג המולד בלי שלג, וכל פרט נמצא שם בכוונה.<\/li><li>CUT TO הוא המשך מיידי. DISSOLVE הוא מעבר זמן.<\/li><\/ul><p>״כתיבת תסריט דומה יותר לשירה מאשר לפרוזה״: מבנה, צורה, מבנה, מבנה. כמה שיותר מידע בכמה שפחות מילים.<\/p><p>השוואה: הפתיחה של <b>Brick<\/b> (ריאן ג׳ונסון). אותה סיטואציה, כתיבה יבשה ועיתונאית, טון של סרט בלשים.<\/p><h3>לשבוע הבא<\/h3><p>לקרוא פעמיים את התסריט של דובר קוסאשווילי (״עם חוקים״). ייתכן בוחן.<\/p><p class=\"muted\">(סוכם מתוך מסמך הסיכומים המשותף של הכיתה בדרייב. כדאי לעבור מול המקור.)<\/p>", "courseId": "kriya", "date": "2026-11-02", "origin": "mine", "tags": "סאונד, אונומטופיאה, אליטרציה, דימוי", "title": "שיעור 2: להכניס את הקורא לעולם, הפתיחה של Go", "url": "https://docs.google.com/document/d/1pdzbmudQqV4PZkvg0SKkU2lmqfJa5DAycIkvchASHnE/edit", "id": "kriya-2"}, {"attachments": [], "body": "<h3>סינופסיס<\/h3><p>בכיתה: 10 דקות לכתוב סינופסיס של 50 מילה ל״עם חוקים״. שתי דרכים: ככלי שיווקי שמשאיר את הסוף פתוח, או לספר את כל הסיפור. ״זהו סיפורו של...״ מגדיר מי הגיבור, מי מניע את העלילה. ההמלצה: להתמקד בסיפור ולהשאיר את התמה לקורא.<\/p><h3>מאורע מחולל<\/h3><p>מה שמתניע את הסיפור ומוציא את הגיבור מהאיזון היומיומי. בדרך כלל חיצוני לגיבור. דוגמאות: גנדלף מזמין את פרודו, ההזמנה בהארי פוטר, ״פתאום דפיקה בדלת״. ב״עם חוקים״ הוא קטן: אין החזרות, ודובר מחליט לקחת את הכסף.<\/p><h3>נקודת מפנה<\/h3><p>מה הגיבור מחליט לעשות אחרי מה שקרה לו. כשהדמות בדילמה, שאלו מה אתם הייתם עושים, ותנו לה לעשות את ההפך. המטרה היא לסבך לה את החיים.<\/p><h3>Blue Velvet (דיוויד לינץ׳)<\/h3><p>פתיחה בשורת דיזולבים: גדר לבנה, ורדים, שוטר ״נקי״ מחייך, כבאי מנופף, טוליפים. עולם מלאכותי שמכין את ״הסיוט האמריקאי״. ״אוויר קייצי״ לא נראה, אבל הוא חלק מהאווירה.<\/p><p class=\"muted\">(סוכם מתוך מסמך הסיכומים המשותף של הכיתה בדרייב. כדאי לעבור מול המקור.)<\/p>", "courseId": "kriya", "date": "2026-11-09", "origin": "mine", "tags": "סינופסיס, מאורע מחולל, נקודת מפנה", "title": "שיעור 3: ״עם חוקים״, סינופסיס ומאורע מחולל", "url": "https://docs.google.com/document/d/1pdzbmudQqV4PZkvg0SKkU2lmqfJa5DAycIkvchASHnE/edit", "id": "kriya-3"}, {"attachments": [], "body": "<p>הסרט ״הנוצצים בפריז״: תסריטאי שצריך לכתוב תסריט ב־48 שעות. כל מה שהעוזרת אומרת נכנס לתסריט. תסריטאים בולשים אחר אנשים סביבם, ויש בזה גם שאלה מוסרית. אוצר המילים שלכם מלמד מי אתם.<\/p><h3>תפקיד הסצנה<\/h3><p>בכל סצנה טובה צריך לקרות משהו משמעותי לעלילה. השאלה היא לא רק איך כותבים אלא מה: אם הסצנה תחסר, יגידו שמשהו חסר?<\/p><ul><li><b>Go:<\/b> אישה פצועה בסכנת חיים, ואחר כך בחור כלוא בתא מטען.<\/li><li><b>Brick:<\/b> בחור מוצא גופה.<\/li><li><b>Blue Velvet:<\/b> האיש עם הצינור. הצינור מתקפל והוא חוטף התקף. מה שקורה לצינור קורה לו בגוף.<\/li><\/ul><p>באף אחד משלושתם הגופה אינה הגיבור.<\/p><h3>Barton Fink (האחים כהן)<\/h3><p>כתבו אותו כשנתקעו בתסריט אחר: תסריטאי תקוע במלון ריק. נפתח בסאונד של מכונת כתיבה ובאקסטרים קלוז־אפ על האותיות.<\/p><p><b>המסקנה:<\/b> כל הפתיחות שראינו נפתחו בסאונד. גם Birdman והארי פוטר 6. שימו לב לפתיחות כבר משלב הלוגואים.<\/p><h3>מה צפוי<\/h3><p>בחנוכה יינתן תרגיל: לכתוב בפורמט תסריט סצנה מסרט קיים.<\/p><p class=\"muted\">(סוכם מתוך מסמך הסיכומים המשותף של הכיתה בדרייב. כדאי לעבור מול המקור.)<\/p>", "courseId": "kriya", "date": "2026-11-16", "origin": "mine", "tags": "פתיחות, סאונד, תפקיד הסצנה", "title": "שיעור 4: מה התפקיד של הסצנה הראשונה", "url": "https://docs.google.com/document/d/1pdzbmudQqV4PZkvg0SKkU2lmqfJa5DAycIkvchASHnE/edit", "id": "kriya-4"}, {"attachments": [], "body": "<p>הפתיחה היא כרטיס הביקור שלכם ככותבים: מי אתם, מה הכישרון שלכם, והאם יש לקורא עניין להמשיך.<\/p><h3>האחדה בין הכתיבה לסרט<\/h3><p>ב״הנוצצים בפריז״ האופן שבו התסריטאי כותב ומתאר דמויות מאפיין את מה שרואים בסרט. כתיבה שנונה מתאימה לסרט שנון, תסריט יבש לסרט יבש (כמו Brick, לקוני ובטמפרטורה רגשית נמוכה). לא כל סוג כתיבה מתאים לכל סרט. אפשר לזהות את הז׳אנר כבר מפסקת הפתיחה.<\/p><h3>לדחוס עולם לדף<\/h3><p>כתיבת תסריט שקולה לשירה ולא לפרוזה: מילים טעונות, כמה שיותר מידע בפחות טקסט. התסריט דומה לתשריט של אדריכלים, שרק אנשי מקצוע יודעים לקרוא.<\/p><p><b>סאונד<\/b> עוקף את הקושי לתאר תמונה: צרצרים, ממטרה, טקטוק של שעון נכנסים לראש גם מהנייר, ומסקרנים לגבי העולם. טיפ טוב, אם הוא רלוונטי לסיפור.<\/p><h3>חובות הקורס (לפי הסיכום)<\/h3><ul><li>חנוכה: לכתוב בשפה שלנו תסריט של סצנה מסרט קיים.<\/li><li>סוף השנה: לקרוא תסריט באורך מלא ולנתח אותו.<\/li><\/ul><p class=\"muted\">(סוכם מתוך מסמך הסיכומים המשותף של הכיתה בדרייב. כדאי לעבור מול המקור.)<\/p>", "courseId": "kriya", "date": "2026-11-23", "origin": "mine", "tags": "טון, ז׳אנר, סאונד, פתיחות", "title": "שיעור 5: הטון של הכתיבה הוא הטון של הסרט", "url": "https://docs.google.com/document/d/1pdzbmudQqV4PZkvg0SKkU2lmqfJa5DAycIkvchASHnE/edit", "id": "kriya-5"}, {"attachments": [], "body": "<p>להגשות: גופן 14 לפחות, לא לשכוח שם. חשוב ממש לקרוא.<\/p><p>ספרות וקולנוע הן צורות חשיבה שונות לחלוטין.<\/p><h3>פתיחות<\/h3><p>הפתיחה הנכונה היא מיקרוקוסמוס של היצירה כולה, ושם נמצאות ההחלטות החשובות ביותר.<\/p><p>דוגמה: גאווה ודעה קדומה. פתיחה שמצהירה משהו כדי להבטיח בדיוק את ההפך. הפסקים יוצרים מנגינה של \"לא התחייבתי לכלום\".<\/p><p>הפנייה הישירה. מי המספר, איזה גוף, הבחירה בזמן (למשל הווה).<\/p><h3>סוגי מספרים<\/h3><p>מספר יודע־כל, מספר עד, מספר לא אמין (עגנון כדוגמה).<\/p><p>מתי כותבים את הפתיחה? הבחירות: הזמן הדקדוקי, מי המספר, איך זה קרה ולמה, מול מה יקרה.<\/p><p>תרגיל 2: כמה פתיחות קצרות, שונות זו מזו ככל האפשר (התחייבות, גוף המספר, זמן ומקום, הבטחה, סוג העברית).<\/p><p>(סוכם מתוך קובץ ה־PDF של ההערות. הטקסט בקובץ יצא הפוך, אז כדאי לעבור על הסיכום מול המקור.)<\/p>", "courseId": "ktiva", "date": "2026-10-26", "origin": "mine", "tags": "פתיחות, מספר", "title": "שיעור 1: פתיחות, איך פותחים סיפור", "url": "https://drive.google.com/file/d/1n-MNR_yRcIzr2RV39OtaPyDyVAXu-SGl/view", "id": "ktiva-1"}, {"attachments": [], "body": "<h3>איך מקבלים משוב<\/h3><p>מומלץ להקריא את הטקסטים בקול ולתת משוב שאינו רק התרשמותי. לא מתווכחים עם משוב: הסופר לא מלווה את הספר לספרייה כדי להסביר אותו. אפשר לתקן, לא לשנות, או לא להסכים ובכל זאת לתת לזה לגרום לחשוב.<\/p><p>גוף ראשון מייצר הזדהות, אבל לפעמים רוצים מרחק. רגש צריך עוגן, פסקה שתאפשר לדמיין את הדמות. במספר בגוף ראשון בעבר צריך להחליט כמה רחוק העבר, כי זה מכתיב את הטון.<\/p><h3>מה עושה דיאלוג טוב בסיפור<\/h3><ul><li><b>האיך חשוב מהמה.<\/b> לומדים על יחסים לא משיחה עליהם. החמניות של ואן גוך הן ציור של חרדה.<\/li><li><b>סאבטקסט.<\/b> השיחה שמתחת לשיחה. דוגמאות: פיי וולדון, ו״גבעות כמו פילים לבנים״ של המינגוויי. כדאי לצותת לשיחות של אנשים.<\/li><li><b>לא להעביר מידע דרך דיאלוג<\/b> (״אחותך המלומדת מהרווארד״). דיאלוג הוא פעולה, כמו משחק טניס, ולרוב התרחשות.<\/li><li><b>עברית מדוברת כתובה<\/b> אינה העתק של הדיבור. להתמקד בעיקר.<\/li><\/ul><p>דיאלוג הוא אמצעי הנכחה חזק: המספר נעלם. לכן משתמשים בו במשורה ולא מבזבזים אותו על זוטות.<\/p><h3>תרגיל<\/h3><p>דיאלוג נטו. שלוש שורות על הדמויות והסיטואציה, ואז דיאלוג עם סאבטקסט. עד עמוד, גופן 14, רווח כפול.<\/p><p class=\"muted\">(סוכם מתוך מסמך הסיכומים המשותף של הכיתה בדרייב. כדאי לעבור מול המקור.)<\/p>", "courseId": "ktiva", "date": "2026-11-02", "origin": "mine", "tags": "משוב, דיאלוג, סאבטקסט", "title": "שיעור 2: משוב, ודיאלוג בסיפור", "url": "https://docs.google.com/document/d/17h-utVDsY_rYiyADO9ONnCEn9q6XihSAO00JayIGXG4/edit", "id": "ktiva-2"}, {"attachments": [], "body": "<h3>מתי נכנסים לדיאלוג<\/h3><p>בסיפור צריך להחליט מתי להיכנס לציטוט ישיר ומתי לצאת ממנו. ציטוט נותן תחושה שאנחנו שומעים במו אוזנינו, ולכן כדאי לשמור אותו לרגעים שחשוב להנכיח. דיאלוג ארוך מאבד מכוחו.<\/p><h3>״דבר קטן וטוב״: תנועת משפך<\/h3><p>בסצנה עם האופה: קודם תיאור כללי של תוכן השיחה (הספק, המוגבלות, הבדידות), אחר כך שומעים את קול האופה דרך קולו של המספר (הכיבוד, החגיגות, ציפוי הסוכר), ורק בסוף ציטוט ישיר אחד: ״תריחו את זה... זה לחם עשיר״. הציטוט הישיר נשמר ללחם, לתמונה של חסד ונחמה.<\/p><p><b>מבע משולב:<\/b> המספר מדבר, אבל שומעים דרכו את הדמות. זה לא ציטוט.<\/p><h3>כללי כתיבה<\/h3><ul><li>להבדיל בין הכותב לדמות, גם במספר בגוף ראשון. הומברט הוא לא נבוקוב.<\/li><li>להימנע מתוארי פועל (״אמרה בשמחה״). אם יש שמחה, היא צריכה להישמע בדברים. במקום ״כתבה בפסקנות״, ״קבעה״.<\/li><li>לכל מילה יש מנגינה. לדייק.<\/li><\/ul><h3>תרגיל<\/h3><p>קטע שיחה שבו שוקלים ברצינות מה מובא כציטוט ישיר ומה כתיאור שיחה. לתרגל מבע משולב, בהשראת הסיום של ״דבר קטן וטוב״. עמוד אחד, רווח כפול, גופן 14.<\/p><p class=\"muted\">(סוכם מתוך מסמך הסיכומים המשותף של הכיתה בדרייב. כדאי לעבור מול המקור.)<\/p>", "courseId": "ktiva", "date": "2026-11-09", "origin": "mine", "tags": "מבע משולב, דיאלוג, דבר קטן וטוב", "title": "שיעור 3: ציטוט ישיר מול תיאור שיחה, ומבע משולב", "url": "https://docs.google.com/document/d/17h-utVDsY_rYiyADO9ONnCEn9q6XihSAO00JayIGXG4/edit", "id": "ktiva-3"}, {"attachments": [], "body": "<h3>מבע משולב<\/h3><p>קול המספר משתלב בקולה ובתודעתה של הדמות, בגוף שלישי ובלי מרכאות. שלוש דרכים לייצג דיבור: ציטוט ישיר, סיכום שיחה, מבע משולב.<\/p><p>היתרונות: פחות דיאלוג, שליטה בקצב, שמירה על קול הדמות, כניסה למחשבות בלי ״חשב בלבו״, ועומק פסיכולוגי.<\/p><h3>מהדיון על התרגילים<\/h3><ul><li>אין צורך ב״קבעה בפסקנות״. הפסקנות כבר בדברים.<\/li><li>פועל צריך להתאים גם לאווירה (״ליטף את אריחי הרצפה״ כשהפעולה נעשית בכעס).<\/li><li>״איזה יום חם, אמרה לעצמה״ מלאכותי. דיבור פנימי עם נמען ברור משכנע.<\/li><li><b>התרגיל שלי (עידו ואביגיל):<\/b> קולה של אביגיל נשמע בתוך הסיפור דרך מבע משולב (״רק שלשום חזר וכבר הוא שב לצבא…״), בתוך התודעה של עידו, ומעצים את האשמה שלו. עלה גם השילוב בין משלב גבוה לבין ״זאתי״.<\/li><\/ul><h3>הצגת דמות בפעם הראשונה (מספר יודע־כל)<\/h3><p><b>מה לא:<\/b> תיאור כ״רשימת קניות״, קלישאות (״עצב כמוס״), תוויות פסיכולוגיות (״טראומה״, ״דיכאון״), ״בחינניות האופיינית לה״ כשעוד לא מכירים אותה.<\/p><p><b>מה כן:<\/b> דרך פעולה ותנועה, פרט מאפיין אחד, או ביוגרפיה ומה שאחרים אומרים עליה. דמות היא קודם כל המעשים שלה, ובעיקר איך היא עושה אותם.<\/p><p>דוגמאות: אפדייק (״המכשפות מאיסטוויק״), גוטפרוינד (״אחוזות החוף״), דה אמפולי (״המכשף מהקרמלין״), דיקנס (״ניקולס ניקלבי״), ו״ינטל״.<\/p><h3>הקורא והדמות<\/h3><p>אנה קרנינה משתנה כשהקורא משתנה. שרנסקי בכלא נעזר בהמלט, גרגנטואה ופלסטף.<\/p><h3>תרגיל<\/h3><p>להציג דמות בפעם הראשונה בסיפור, מפי מספר יודע־כל. לא להכביר. לקריאה: תיאור גברת הייז ב״לוליטה״, ואלבר כהן.<\/p><p class=\"muted\">(מתוך הסיכום שלי לשיעור 4, ומסמך הסיכומים המשותף.)<\/p>", "courseId": "ktiva", "date": "2026-11-16", "origin": "mine", "tags": "מבע משולב, הצגת דמות, מספר יודע־כל", "title": "שיעור 4: מבע משולב והצגת דמות", "url": "https://docs.google.com/document/d/1INCxHyTrR321ZPLeKxc0i52QWHPDYw0gt61PpRo9gYk/edit", "id": "ktiva-4"}, {"attachments": [], "body": "<p>לקרוא יצירות כמו אדם כותב: איך זה עשוי ולמה זה עובד.<\/p><h3>מספר יודע־כל<\/h3><p>יש מנעד: מ״בראשית ברא״, שיודע מה בלב כל דמות, ועד מספר שמתצפת מלמעלה. מספר יודע־כל אינו דמות, אבל לפעמים יש לקולו גוון ואפילו דעות על הדמויות. הוא יכול לבחור זווית וללוות את נקודת המבט של דמות אחת.<\/p><p><b>אנה קרנינה:<\/b> מקבלים את אנה לאורך הרומן דרך דמויות שונות. ״היה בה משהו לטיף״ הוא תיאור של הידלקות, ואת קרנין רואים דרך אנה (״מה זה האוזניים האלה?״). מבט של דמות על דמות הוא התרחשות שלמה.<\/p><p>מילים כמו ״מוזר״ או ״רגיל״ לא אומרות כלום בלי הקשר: מוזר ביחס למה?<\/p><h3>הצגת דמות מפי מספר בגוף ראשון<\/h3><p>כשאדם מתאר אדם אחר, תמיד מקבלים שתי דמויות. בתיאור של גברת הייז ב״לוליטה״ לומדים על הסנוביות ושנאת הנשים של הומברט. אלבר כהן, כשהוא מתאר את אמו, חושף גם את עצמו בלי לדבר על עצמו.<\/p><p>״היא ילדה טובה, כל היום עוזרת לאמא״ מלמד מעט על הילדה והרבה על הדובר. משפט כמו ״היו לו ידיים של אומן וידיים של מכשף״ איום ממספר יודע־כל, אבל אומר משהו כשהוא בא ממספר בגוף ראשון.<\/p><p><b>״ככל שהדמות תרבה לבכות, כך עיני הקורא יישארו יבשות.״<\/b> הדרך הפחות טובה לעורר רחמים היא לתאר אותם.<\/p><p class=\"muted\">הסיכום לא מציין במפורש תרגיל לשבוע הבא. לפי הרצף, כנראה הצגת דמות מפי מספר בגוף ראשון. כדאי לוודא.<\/p><p class=\"muted\">(סוכם מתוך מסמך הסיכומים המשותף של הכיתה בדרייב. כדאי לעבור מול המקור.)<\/p>", "courseId": "ktiva", "date": "2026-11-23", "origin": "mine", "tags": "מספר יודע־כל, גוף ראשון, הצגת דמות", "title": "שיעור 5: מספר יודע־כל, ומספר בגוף ראשון שמציג דמות", "url": "https://docs.google.com/document/d/17h-utVDsY_rYiyADO9ONnCEn9q6XihSAO00JayIGXG4/edit", "id": "ktiva-5"}, {"attachments": [], "body": "<h3>הרעיון המרכזי<\/h3><p>התסריטאי מתרגם רעיונות ורגשות למה שאפשר לראות ולשמוע. במקום \"הוא עצוב\" כותבים התנהגות, פעולה, חלל או צליל. \"תמונה... ומה ששומעים. זה הכלל הכי חשוב בקולנוע.\"<\/p><h3>למה תסריטאי צריך מבע<\/h3><p>התסריט הוא תוכנית עבודה לבמאי, לצלם, לעיצוב, לשחקנים, לעורך ולהפקה. בחירה של לוקיישן, אביזר ואווירה היא חלק מהמשמעות.<\/p><h3>שני ערוצים<\/h3><p>תמונה: לוקיישן, גדלי שוט, זוויות, תנועת מצלמה, תלבושות, תאורה, מיזנסצנה, עריכה.<\/p><p>פסקול: דיאלוג, מוזיקה דיאגטית וחוץ־דיאגטית, אפקטים, דממה, קריינות.<\/p><h3>מושגי יסוד<\/h3><p>פריים, שוט, קלוז־אפ, אקסטרים קלוז־אפ, מדיום שוט, לונג שוט, אקסטרים לונג שוט.<\/p><p>Tilt, Pan, Dolly, Zoom. ההבדל: בדולי המצלמה נעה במרחב והיחסים בין חזית לרקע משתנים, בזום המצלמה נשארת במקום ורק המסגור משתנה.<\/p><p>מיזנסצנה: כל מה שמוצב מול המצלמה. Blocking: העמדת השחקנים ותנועתם.<\/p><h3>מבע שקוף מול מבע מודגש<\/h3><p>שקוף (הוליווד הקלאסית): עריכה המשכית, הצופה נשאב לעלילה.<\/p><p>מודגש (הגל החדש, ברכט): ג׳אמפ־קאטים, כתוביות, שבירת הקיר הרביעי, הצופה מודע למדיום.<\/p><h3>סצנות שנותחו<\/h3><p>הדיקטטור הגדול (צ׳פלין): סצנת המספרה, שוט סטטי ורציף בתזמון עם המחול ההונגרי מס׳ 5 של ברהמס. הווירטואוזיות בזמן אמת היא הקומדיה.<\/p><p>הסנדק (קופולה, 1972): \"I believe in America\" על שחור, Dolly Out איטי שמעביר את מרכז הכובד לדון קורליאונה, תאורה עילית וצללים בעיניים, ניגוד בין המשרד החשוך לחתונה המוארת.<\/p><p>סוף שבוע (גודאר, 1967): שוט מעקב ארוך לאורך פקק, צפירות, תאונה בסוף. מבע מודגש שמתיש בכוונה.<\/p><h3>שאלות לחזרה<\/h3><p>איך מתרגמים מצב רגשי לפעולה? מה ההבדל בין פריים, שוט וסצנה? דולי מול זום? איך הפתיחה של הסנדק בונה היררכיה?<\/p>", "courseId": "mabaa", "date": "2026-10-26", "origin": "mine", "tags": "גדלי שוט, תנועת מצלמה, מבע שקוף, הזרה", "title": "שיעור 1: השפה הקולנועית, מה שרואים ומה ששומעים", "url": "https://drive.google.com/file/d/1LsRA4nGX5PpJu3vdjGBu0l65VWBbZ68C/view", "id": "mabaa-1"}, {"attachments": [], "body": "<p>קורס כתיבה תסריטאית, 6–7 עבודות בית, נשלחות במייל להלל המתרגל.<\/p><p><b>תסריט הוא התכנית של הסרט,<\/b> כמו תכנית אדריכלית. הוא עובר הרבה ידיים (סאונד, ליהוק, הפקה), וכל אחד מוסיף את הנדבך שלו. בתסריט כותבים רק שני דברים: מה שרואים ומה ששומעים.<\/p><h3>איך חושפים עולם פנימי<\/h3><p>באופרת סבון הדיאלוג הוא המלך, כי זה חסכוני. אבל אמנות קשורה למסתורין (המונה ליזה). <b>Show, don't tell:<\/b> פעולה דרמטית חזקה יותר מאמירה. איך אומרים ״אני אוהב אותך״ קולנועית? אולי הוא מכניס מדיח בלילה.<\/p><p><b>לפעולה חייב להיות מחיר.<\/b> ככל שהגיבור מסכן יותר ומשלם יותר, הבחירה דרמטית יותר ונוצר קונפליקט.<\/p><p>דוגמה: שמות פרק ב׳. אין דיאלוג וכמעט אין רגשות, רק אוסף פעולות. לפי האתוס המקראי, אתה קיים רק אם אתה פועל.<\/p><h3>תרגיל בכיתה<\/h3><p>״היא הולכת ברחוב וחושבת כמה היא מתגעגעת אליו״, בלי לכתוב מחשבה: הטלפון, ההודעה האחרונה, החדשות על חיילים, השוקולד האהוב עליו בתיק. קונקרטיות ואודיו־ויזואליות.<\/p><h3>שיעורי בית<\/h3><p>תסריט של עמוד עד שניים בנושא קנאה. מי מקנא, במה, ואיזו פעולה מראה את זה. בלי דיאלוג בכלל.<\/p><p class=\"muted\">(סוכם מתוך מסמך הסיכומים המשותף של הכיתה בדרייב. כדאי לעבור מול המקור.)<\/p>", "courseId": "mavo", "date": "2026-10-26", "origin": "mine", "tags": "פעולה, מחיר, show don't tell", "title": "שיעור 1: תסריט הוא תכנית אדריכלית", "url": "https://docs.google.com/document/d/1lE3vnNp_Djl8I61Fjyq0lDTrDCCtoxwhHp42ymy8E_o/edit", "id": "mavo-1"}, {"attachments": [], "body": "<p>בתסריט משתמשים ב<b>החצנה<\/b>: כל רגש פנימי צריך לעלות למסך, לראות או לשמוע. מישהי בלחץ, הרגל שלה רועדת. להיות ספציפיים, אבל לא יותר מדי: לא ״גבר הולך ברחוב״ אלא מי הוא ובן כמה.<\/p><h3>מודל להחצנת רגש<\/h3><ol><li>מי מרגיש? (הגיבור)<\/li><li>כלפי מי? הגיבור צריך סובייקט, מישהו או משהו שהאנרגיה שלו מופנית אליו.<\/li><li>מה הפעולה, והאם היא מדויקת לרגש? שאול זורק חנית על דוד.<\/li><\/ol><p><b>דרמה ביוונית היא פעולה.<\/b> איש נכנס לחדר, מתיישב, מתחיל לבכות: שלוש פעולות, והנה סיפור. הצופה מחבר את הפעולות ובונה את הסיפור בעצמו.<\/p><h3>הפורמט<\/h3><ul><li>שם התסריט, שם התסריטאי, תאריך ומספר גרסה. עמודים ממוספרים, עמוד הוא בערך דקה.<\/li><li>כל סצנה ממוספרת, עם כותרת: פנים/חוץ, איפה, יום/לילה. סצנה חדשה בכל שינוי מקום או זמן.<\/li><li>דמות שמופיעה לראשונה מודגשת, ובסוגריים גיל ופרט מזהה.<\/li><li>דיאלוג ממורכז, שם הדובר מעליו, והוראות בימוי רק כשצריך.<\/li><li>גופן אריאל או דוד, 13, רווח בודד. רווח כפול בין פסקה לדיאלוג. לא מדפיסים דו־צדדי.<\/li><li>O.S. הוא סאונד מהסצנה שמקורו לא נראה. V.O. הוא קול מעל הסצנה.<\/li><li>לכתוב רק מה שהכרחי לסיפור: אם מוחקים והסיפור נעלם, המידע צריך להישאר.<\/li><\/ul><p>לצפייה: <b>אמדאוס<\/b>, ״שיעור בקולנוע״.<\/p><h3>תרגיל כתיבה 2<\/h3><p>בפורמט התסריטאי, בנושא פחד. מי הגיבור, מה הדבר המפחיד שקרה, איך הוא גרם לו לפעול, ולמה זה מעניין. האם הגיבור מפחד, או הצופה? עד 2–3 עמודים.<\/p><p class=\"muted\">(סוכם מתוך מסמך הסיכומים המשותף של הכיתה בדרייב. כדאי לעבור מול המקור.)<\/p>", "courseId": "mavo", "date": "2026-11-02", "origin": "mine", "tags": "פורמט, החצנה, דרמה, פחד", "title": "שיעור 2: הפורמט התסריטאי, ודרמה היא פעולה", "url": "https://docs.google.com/document/d/1lE3vnNp_Djl8I61Fjyq0lDTrDCCtoxwhHp42ymy8E_o/edit", "id": "mavo-2"}, {"attachments": [], "body": "<p>איך הופכים געגוע, תקווה או מבוכה לאירוע קולנועי? לא מתארים את הרגש במילים, אלא יוצרים תנאים שבהם הצופה ירגיש אותו. כתיבה ספרותית היא עולם פנימי ופרשנות. כתיבה תסריטאית היא מה שנראה ונשמע, התנהגות ופרטים במרחב.<\/p><p>דוגמה: ״דנה חרדה מהמפגש עם אביה, אבל לא הפסיקה לקוות שיגיע״. בתסריט: דנה בתחנה, מציצה בשעון, מכונית מאטה, היא מזדקפת, המכונית ממשיכה, פניה נופלות.<\/p><h3>ארבעה דברים שאפשר לביים<\/h3><ul><li><b>חפץ:<\/b> עומדת למרות שיש כיסא פנוי.<\/li><li><b>פעולה:<\/b> מציצה בשעון שוב ושוב.<\/li><li><b>משך:<\/b> מבט שנמשך שנייה יותר מדי.<\/li><li><b>צליל:<\/b> רכב מתקרב.<\/li><\/ul><p><b>שלד הסצנה:<\/b> איפה, מה קורה, למי. ״רק מה שאפשר לצלם״ הוא כלל עבודה, לא חוק טבע.<\/p><p><b>בקומדיה הדמות מתקרבת לעצמה, ובטרגדיה מתרחקת מעצמה.<\/b><\/p><h3>ארבע שאלות לתרגיל הקנאה<\/h3><ol><li>המניע: מה יש לאחר ואין לה?<\/li><li>הפעולה: איזו פעולה מבטאת את הקנאה, ובאיזה ווליום?<\/li><li>השפה: מה רואים ושומעים?<\/li><li>הדרמה: מה משתנה מתחילת הסצנה ועד סופה?<\/li><\/ol><p>רצון, פעולה, הסלמה, פורמט. דוגמה: Whiplash.<\/p><p class=\"muted\">(סוכם מתוך מסמך הסיכומים המשותף של הכיתה בדרייב. כדאי לעבור מול המקור.)<\/p>", "courseId": "tirgul", "date": "2026-11-02", "origin": "mine", "tags": "רגש, פעולה, שלד סצנה, קנאה", "title": "מרגש פנימי לאירוע קולנועי", "url": "https://docs.google.com/document/d/1SRd-3Pi-b4_Y5tELZG_v1HN7weVCvRimsG5_VNDOocM/edit", "id": "tirgul-2"}, {"attachments": [], "body": "<p>ככל שהפעולות ספציפיות יותר, קל יותר להתחבר לדמות, גם בעולם שאיננו מכירים (״אפשרות לאהבה״). לא אילוסטרציות (״אישה דתייה קוראת תהילים״) אלא פעולה מדויקת. The Talented Mr. Ripley: החליפה והמראה.<\/p><h3>מה כותבים<\/h3><p>פעולות ובחירות, פריטים חזותיים בעלי משמעות, סאונד שמדייק את החוויה, והכול עובר דרך הדמות. <b>לבדוק פעמיים:<\/b> מחשבות שהצופה לא רואה, ביוגרפיה בלי ביטוי, תיאור של כל רגע יומיומי, הוראות צילום מיותרות.<\/p><p><b>קונפליקט מול דילמה:<\/b> בקונפליקט יש שתי אפשרויות ורק אחת נכונה.<\/p><h3>מבחן הפרט<\/h3><p>טכני: היא פותחת ארון, מוציאה כוס, כפית, חלב, מוזגת. משמעותי: היא מוזגת קפה, הכוס עולה על גדותיה, ידה נשארת תלויה באוויר. אם נמחק את הפרט, נאבד משהו?<\/p><h3>פעולה רגשית<\/h3><p>הרגש (ממה היא חוששת), הרצון (מה היא רוצה עכשיו), הפעולה (מה היא עושה ובאיזה ווליום), התוצאה (מה משתנה). דוגמה: 8th Grade, קיילה מול מסיבת הבריכה, הדלת שלא נפתחת.<\/p><h3>עיבוד ספרות לקולנוע<\/h3><ul><li>סימור צ׳טמן, Story and Discourse: מה הסיפור ואיך הוא מסופר.<\/li><li>לינדה האצ׳ון, A Theory of Adaptation: אפשר להיות נאמן לרוח גם כשמשנים את הפעולה.<\/li><li>אתגר קרת: איפה הדמות נמצאת ומה היא עושה. המיזנסצנה היא חלק מהמשמעות.<\/li><\/ul><p>חמש שאלות: מה לב הסיפור, מה הדמות רוצה, איזה מידע נמצא רק במילים של המספר, מה המקבילה הקולנועית, מה שומרים ומה משנים.<\/p><p class=\"muted\">(סוכם מתוך מסמך הסיכומים המשותף של הכיתה בדרייב. כדאי לעבור מול המקור.)<\/p>", "courseId": "tirgul", "date": "2026-11-09", "origin": "mine", "tags": "פחד, פעולה רגשית, עיבוד, מבחן הפרט", "title": "שיעור 3: פעולה רגשית, פחד ועיבוד", "url": "https://docs.google.com/document/d/1SRd-3Pi-b4_Y5tELZG_v1HN7weVCvRimsG5_VNDOocM/edit", "id": "tirgul-3"}, {"attachments": [], "body": "<p><b>המחיר:<\/b> לכל בחירה של הדמות יש מחיר. בלי מחיר משמעותי, שאלת ה״למה״ מתחדדת. המחיר מעלה את הווליום של הבחירות. להתחיל לתרגל אפיון דמות כבר עכשיו.<\/p><h3>Funny Games (מיכאל הנקה)<\/h3><p>שגרה סטטית ולא דרמטית, ומתוכה אימה שהולכת ומתגברת: הנורמלי משתנה, ההמתנה יוצרת מתח, הצופה משלים. מה הדמות עלולה לאבד?<\/p><h3>מהדיון על תסריטי הפחד<\/h3><ul><li>שגרה שהופכת למאיימת. מוטיב של סגירת דלתות כשפה של הסרט. כשמשהו מפר את השגרה, להראות את התגובה. חסר רגע סוגר, למשל מבט לדלת.<\/li><li>לשים לב לבחירות, לשמות ולסטריאוטיפים. להראות את מושא התקווה של הדמות.<\/li><\/ul><p><b>לין רמזי:<\/b> קולנוע חושי. הגוף, הסאונד והזיכרון מדברים במקום הדיאלוג (״חייבים לדבר על קווין״, ״תמות אהובי״).<\/p><p class=\"muted\">(סוכם מתוך מסמך הסיכומים המשותף של הכיתה בדרייב. כדאי לעבור מול המקור.)<\/p>", "courseId": "tirgul", "date": "2026-11-16", "origin": "mine", "tags": "מחיר, אפיון דמות, מתח, פחד", "title": "שיעור 4: המחיר, ומתח מתוך שגרה", "url": "https://docs.google.com/document/d/1SRd-3Pi-b4_Y5tELZG_v1HN7weVCvRimsG5_VNDOocM/edit", "id": "tirgul-4"}], "assignments": [{"courseId": "ktiva", "due": "2026-11-02", "origin": "mine", "priority": "רגילה", "status": "הוגש", "title": "קריאה", "updatedAt": "2026-11-16T15:52:08.173Z", "url": "https://drive.google.com/drive/folders/1ysw7WnpCZKHFo10HshdrGC5q52g0bHlT", "id": "as-mvwnep0jo5sg"}, {"courseId": "ktiva", "due": "2026-11-09", "notes": "כתיבת דיאלוג בפורמט מחזה - ללא תיאורים ופעולות", "origin": "mine", "priority": "רגילה", "status": "הוגש", "title": "כתיבת דיאלוג נטו", "updatedAt": "2026-11-16T15:52:18.306Z", "id": "as-mvzco414pecp"}, {"courseId": "kriya", "due": "2026-11-09", "origin": "mine", "priority": "רגילה", "status": "הוגש", "title": "קריאת ״עם חוקים״", "updatedAt": "2026-11-23T05:46:28.523Z", "id": "as-mvzdroxcoh8k"}, {"courseId": "kriya", "delivery": "", "due": "", "notes": "50% מהציון", "origin": "mine", "priority": "רגילה", "status": "לא התחלתי", "title": "עבודת סיום: ניתוח תסריט מלא", "url": "", "id": "kriya-final"}, {"courseId": "kriya", "delivery": "", "due": "", "notes": "30% מהציון. בשיעור 6 או 7 תוקרן סצנה בכיתה, ואותה כותבים בפורמט תסריט לפי מה שנלמד.", "origin": "mine", "priority": "רגילה", "status": "לא התחלתי", "title": "מטלת אמצע: לכתוב סצנה מסרט בפורמט תסריט", "url": "", "id": "kriya-mid"}, {"courseId": "ktiva", "delivery": "", "due": "", "notes": "דרישה מהסילבוס, בנוסף לתרגילים השוטפים", "origin": "mine", "priority": "רגילה", "status": "לא התחלתי", "title": "רשימת ביקורת על יצירה קנונית", "url": "", "id": "ktiva-crit"}, {"courseId": "ktiva", "delivery": "להביא מודפס לשיעור", "due": "2026-11-02", "feedback": "משוב על תרגיל הכתיבה – שני פתיחים לאותו סיפור\n1. בחירת נקודת המבט וההבדל בין הפתיחים\nהמרצה ציינה כי התרגיל מדגים היטב את ההבדל בין כתיבה בגוף ראשון לבין כתיבה באמצעות מספר יודע-כל.\nבפתיח השני נעשה שימוש מוצלח בטכניקת הַטְרָמָה – חשיפת מידע על העתיד, כאשר המספר מגלה לקורא שכעבור שעות ספורות תעמוד הגיבורה בבית העלמין. זהו יתרון של המספר יודע-הכול, שאינו מוגבל לידיעתה של הדמות ברגע ההתרחשות.\n2. סאבטקסט ויצירת מתח\nבפתיח הראשון זכה המשפט \"זה הולך להיות יום מדהים\" לשבחים מיוחדים. המרצה ציינה כי הוא יוצר סאבטקסט חזק ותחושה מבשרת רעות, דווקא בשל הפער בין הציפייה האופטימית של הדמות לבין התחושה שמשהו רע עומד להתרחש.\nבפתיח השני נוצר מתח מסוג אחר: הקורא כבר יודע שהיום יסתיים בבית העלמין, והסקרנות מתמקדת בשאלה כיצד תתגלגל העלילה אל האירוע הדרמטי.\n3. בניית הדמות והדיסוננס הפנימי\nהמרצה והמשתתפות שיבחו את האופן שבו דמותה של תחיה נבנית בקלילות, בטבעיות ובאופן מסקרן, ללא העמסת הסברים.\nבמיוחד צוין לטובה הדיסוננס בדמות: השילוב בין תפילה מתוך סידור ורוד מעוטר בזהב לבין שיעור אקרובטיקה על עמוד והעלאת סרטונים לסטורי. הניגוד בין העולמות מעניק לדמות מורכבות ומעורר עניין.\n4. הערה סגנונית – הדגשות וסימני פיסוק\nהמרצה המליצה להימנע משימוש בהדגשות גרפיות (Bold) ומריבוי סימני קריאה בכתיבה ספרותית.\nלדבריה, הדגשה גרפית דומה להוספת אימוג'י לטקסט: היא עלולה לשדר חוסר ביטחון ביכולתן של המילים להעביר בעצמן את העוצמה הרגשית או הדרמטית.\nבעקבות ההסבר של צורית כי היא מורגלת בהדגשות מעבודתה בקופירייטינג, המליצה המרצה לתרגל יצירת הדגשים באמצעות בחירת מילים, מבנה משפטים וניסוח בלבד.\nסיכום המשוב\nשני הפתיחים זכו למשוב חיובי על יצירת סקרנות ומתח, על בניית דמות מורכבת באמצעות פרטים קטנים ועל שימוש מודע בנקודות מבט שונות. החוזקה המרכזית שעלתה בתרגיל היא היכולת ליצור פער בין מה שהדמות יודעת ומרגישה לבין מה שהקורא מבין או מצפה שיתרחש.\nהנקודה המרכזית לשיפור היא המעבר מהרגלי כתיבה פרסומית לכתיבה ספרותית, תוך מתן אמון בכוחן של המילים לייצר משמעות, הדגשה ודרמה ללא אמצעים גרפיים.", "notes": "פתיח 1: מספרת בגוף ראשון, הווה. פתיח 2: מספר כל־יודע, גוף שלישי, עבר. כבר כתוב, נשאר להדפיס.", "origin": "mine", "priority": "רגילה", "status": "הוגש", "title": "תרגיל: שני פתיחים לסיפור", "updatedAt": "2026-11-05T14:22:51.361Z", "url": "/_blob/3c69878a3e16c5ebdfdb4cfe8f8ca3e4", "id": "ktiva-ex2"}, {"courseId": "ktiva", "delivery": "להביא מודפס לשיעור (גופן 14, רווח כפול)", "due": "2026-11-16", "feedback": "מהדיון בשיעור 16.11 (לפי הסיכום שלי):\nהמבע המשולב משמש להצגת הטענות של אביגיל (״רק שלשום חזר וכבר הוא שב לצבא…״), כך שקולה נשמע בלי דיאלוג ישיר.\nהקולות של בני הזוג מתקיימים זה בתוך זה: הטענות של אביגיל נוכחות בתודעה של עידו, מעצימות את האשמה שלו ומחדדות את המורכבות הרגשית.\nעלה גם השילוב בין משלב לשוני גבוה לבין המילה העממית ״זאתי״.", "notes": "עמוד אחד. לשקול מה מובא כציטוט ישיר ומה כתיאור שיחה, ולתרגל מבע משולב בהשראת הסיום של ״דבר קטן וטוב״. הסיפור שלי: עידו ואביגיל.", "origin": "mine", "priority": "רגילה", "status": "הוגש", "title": "תרגיל 3: קטע שיחה, ציטוט ישיר מול מבע משולב", "url": "https://docs.google.com/document/d/1G9YSFCWPI4F_G3ZTbNjWbOc_MMJvFlvrUmaWapCvT_k/edit", "id": "ktiva-ex3"}, {"courseId": "ktiva", "delivery": "להביא מודפס לשיעור (גופן 14, רווח כפול, עם שם)", "due": "2026-11-23", "notes": "פתיחה של סיפור שמציגה דמות בפעם הראשונה, בגוף שלישי, מפי מספר יודע־כל.\n• לא לה /5e530264d48d4ebc2a99e5359db9eab4", "role": "מרצה", "works": "הירושות שלי, בת יפתח, קהילות מדליקות, בסוף יום", "id": "einat"}, {"bio": "סופרת, מחזאית ועיתונאית ישראלית מוערכת, חברת האקדמיה ללשון העברית.", "born": 1959, "courseIds": ["ktiva"], "highlights": "יצירה ספרותית ענפה: פרסמה קרוב ל־20 ספרים במגוון סוגות: רומנים, קובצי סיפורים קצרים, ספרי ילדים, ספרי עיון ואף מדע בדיוני. ״שאהבה נפשי״ זיכה אותה בפרס ספיר.\nהצלחה בינלאומית: ״שאהבה נפשי״ (באנגלית: The Confessions of Noa Weber) זכה להצלחה רבה בארצות הברית ובפרס הספר המתורגם הטוב ביותר מטעם ״שלושה אחוזים״ לשנת 2010. סיפור קצר שלה פורסם ב״ניו יורקר״, ויצירותיה ראו אור בשפות שונות.\nפעילות ציבורית ותקשורתית: כתבה טור אישי ומסות בעיתונים ובכתבי עת בולטים (חדשות, מעריב, ליידי גלובס), לימדה כתיבה במסגרות אקדמיות ותרבותיות, וחברה באקדמיה ללשון העברית.", "links": "", "name": "גיל הר־אבן", "notes": "", "origin": "mine", "photo": "/_blob/16ef0d6036cf0adc48bfccbb09ffd9df", "role": "מרצה", "works": "שאהבה נפשי, אני ליאונה, אנשים טועים, חיים, שאלת הקואלות", "id": "gil"}, {"bio": "במאי, יוצר קולנוע ומרצה ישראלי. העוזר של עמרי לוי במבוא לתסריטאות.", "courseIds": ["tirgul", "mavo"], "highlights": "לימודים ואקדמיה: סיים בהצטיינות את לימודיו ב״מעלה״, שם הוא גם מרצה ואיש צוות, ומחזיק בתואר שני (MFA) בקולנוע דוקומנטרי מאוניברסיטת תל אביב.\nאבנייר (2017): סרט קצר שביים במסגרת לימודיו ב״מעלה״, הוקרן בפסטיבלים וזכה להכרה, בין היתר בפרס איריס לסרט קצר.\nהגדר הטובה: פרויקט קולנועי על מערכת יחסים מורכבת בין אב ובן בהתנחלות על רקע טרגדיה משפחתית. השתתף בחממת ״סטודיו דרום״ וזכה בפרס הראשי בחממת סם שפיגל.\nעוד: הסרט הדוקומנטרי הקצר ״אב ובנו״.", "links": "", "name": "הלל ראטה", "notes": "מעביר את החצי השני של השיעור (התרגול) ועובר על המטלות. ההגשות אליו במייל.", "origin": "mine", "photo": "/_blob/f3328eb3ec9279afba12c819b1296e89", "role": "עוזר הוראה", "works": "אבנייר, הגדר הטובה, אב ובנו", "id": "hillel"}, {"bio": "תסריטאי, במאי קולנוע ואיש אקדמיה ישראלי, מזוהה מאוד עם ״מעלה״.", "courseIds": ["mavo"], "highlights": "תפקיד ב״מעלה״: המנהל האק function dateFromTitle(title){
  const m=String(title).match(/(\d{1,2})[./](\d{1,2})[./](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;const d=+m[1],mo=+m[2];if(d>=1&&d<=31&&mo>=1&&mo<=12)return y+'-'+pad(mo)+'-'+pad(d)}

function lessonNo(title){

  const w=t.match(/(?:שיעור|מפגש)\s+(ה)?([א-ת]+)/);if(w&&HE_ORD[w[2]])return HE_ORD[w[2]];

function kindOf(f){
  const t=normHe(f.title),mt=f.mimeType||'';
  if(/^audio\//.test(mt)||/^video\//.test(mt))return'הקלטה';
  if(/סילבוס|סיליבוס/.test(t))return'סילבוס';
  if(/סיכום/.test(t))return'סיכום';
  if(/תרגיל|מטלה|עבודת|הגשה/.test(t))return'מטלה';
  if(/מושגים/.test(t))return'דף מושגים';
  if(/presentation|powerpoint/.test(mt)||/מצגת/.test(t))return'מצגת';
  if(/תסריט/.test(t.replace(/איך לקרוא תסריט|תסריטאות/g,'')))return'תסריט';
  if(/pdf|document|msword|wordprocessing|text/.test(mt))return dateFromTitle(f.title)?'סיכום':'חומר קריאה';

function classify(f,folderCourse){
  const t=normHe(f.title);let cid=folderCourse,why=[];
  const lec=store.data.courses.filter(c=>c.lecturer&&t.includes(normHe(c.lecturer)));
  let date=dateFromTitle(f.title);
  if(lec.length===1)cid=lec[0].id;
  else if(lec.length>1){const inF=lec.find(c=>c.id===folderCourse);if(inF)cid=inF.id;else if(date){const s=semOf(date);const bySem=lec.filter(c=>s&&(c.semester===s.key||c.semester==='שנתי'));if(bySem.length===1)cid=bySem[0].id}}
  if(!cid)why.push('לא זוהה קורס');
  const kind=kindOf(f);
  
  const needsDate=!['סילבוס','דף מושגים','אחר','תסריט','חומר קריאה','מטלה'].includes(kind);
  if(!date&&needsDate)why.push('לא זוהה תאריך מפגש');
  return{courseId:cid||'',date:date||'',kind,pending:why.length>0,pendingWhy:why.join(' · ')};
}
async function walk(rootId,cfg,onFile){
  const seenFolders=new Set();const queue=[{id:rootId,course:'',path:''}];let folders=0;
  while(queue.length){const q=queue.shift();if(seenFolders.has(q.id))continue;seenFolders.add(q.id);folders++;
    if(folders>60)break;
    drive.progress='קורא תיקייה '+(q.path||'ראשית')+'…';emit();
    const kids=await listChildren(q.id);
    for(const k of kids){
      if(k.mimeType===FOLDER_MIME){queue.push({id:k.id,course:courseForFolder(k,q.course,cfg),path:(q.path?q.path+' / ':'')+normHe(k.title)});continue}
      if(/^application\/vnd\.google-apps\.(shortcut|form|map|site)/.test(k.mimeType))continue;
      onFile(k,q);
    }
  }
}
async function runDriveSync(manual){
  if(drive.running)return;
  const cfg=driveCfg();
  if(!cfg||!cfg.rootId){drive.error='עוד לא חוברה תיקייה.';emit();return}
  if(!drive.mcp){drive.error='החיבור ל־Drive זמין רק כשהאפליקציה פתוחה בתוך Claude, עם מחבר Google Drive מחובר.';emit();return}
  if(store.readOnly){drive.error='אין לך הרשאת עריכה כאן.';emit();return}
  drive.running=true;drive.autoDone=true;drive.syncedThisLoad=true;drive.error='';drive.progress='מתחבר ל־Drive…';emit();
  const res={added:0,updated:0,unchanged:0,pending:0,text:0,missing:0,textFail:0,total:0};
  const startedAt=new Date().toISOString();
  try{
    const found=[];
    await walk(cfg.rootId,cfg,(f,q)=>found.push({f,q}));
    const byDrive={};store.data.files.forEach(x=>{const id=x.driveId||driveIdFromUrl(x.url);if(id&&!byDrive[id])byDrive[id]=x});
    const textJobs=[];const seen=new Set();
    for(const {f,q} of found){
      if(seen.has(f.id))continue;seen.add(f.id);res.total++;
      const ex=byDrive[f.id];
      const base={source:'drive',driveId:f.id,driveTitle:f.title,driveModified:f.modifiedTime||'',mimeType:f.mimeType||'',driveFolder:q.path||'',url:f.viewUrl||ex&&ex.url||'',missingInDrive:false,lastSeenAt:startedAt};
      if(!ex){
        const c=classify(f,q.course);
        const row={...base,title:f.title.replace(/\.(docx?|pdf|pptx?|xlsx?|m4a|mp3|mp4|wav)$/i,'').replace(/[‎‏⁦-⁩]/g,'').trim(),kind:c.kind,courseId:c.courseId,date:c.date,pending:c.pending,pendingWhy:c.pendingWhy,notes:'',done:false,origin:'drive',addedFromDrive:startedAt};
        await saveDoc('files','drv-'+f.id,row);res.added++;if(row.pending)res.pending++;
        if(DRIVE_TEXT_MIMES.includes(f.mimeType))textJobs.push(f);
      }else{
        const changed=(ex.driveModified||'')!==(f.modifiedTime||'');
        const adopt=ex.source!=='drive';
        const upd={...ex,...base};
        if(adopt){upd.confirmed=true;upd.pending=false}
        if(changed&&!adopt&&ex.driveModified)upd.updatedFromDrive=startedAt;
        if(!ex.confirmed&&!adopt&&ex.pending){const c=classify(f,q.course);if(!c.pending){Object.assign(upd,{courseId:c.courseId,date:c.date,kind:c.kind,pending:false,pendingWhy:''})}}
        if(changed||adopt||ex.missingInDrive){await saveDoc('files',ex.id,upd);if(changed&&!adopt&&ex.driveModified)res.updated++;else res.unchanged++}else res.unchanged++;
        if(upd.pending)res.pending++;
        const tx=byId('driveText',f.id);
        if(DRIVE_TEXT_MIMES.includes(f.mimeType)&&(!tx||tx.modified!==f.modifiedTime))textJobs.push(f);
      }
    }
    for(const x of store.data.files){if(x.source==='drive'&&x.driveId&&!seen.has(x.driveId)&&!x.missingInDrive){await saveDoc('files',x.id,{...x,missingInDrive:true});res.missing++}}
    let i=0;
    for(const f of textJobs){i++;drive.progress='קורא את תוכן המסמכים ('+i+' מתוך '+textJobs.length+')…';emit();
      try{const p=await gd('read_file_content',{fileId:f.id});const text=String((p&&(p.fileContent||p.content))||'').slice(0,90000);
        await saveDoc('driveText',f.id,{text,modified:f.modifiedTime||'',title:f.title});res.text++}
      catch(e){res.textFail++;if(e&&['needs_reauth','server_not_connected','not_granted','not_in_manifest'].includes(e.code))throw e}}
    await saveDoc('driveConfig','main',{...driveCfg(),lastSyncAt:new Date().toISOString(),lastResult:res,lastError:''});
    if(manual)toast(res.added||res.updated?('סונכרן: '+res.added+' חדשים, '+res.updated+' עודכנו'):'הכול מעודכן. לא נמצאו קבצים חדשים.');
  }catch(e){drive.error=mcpMsg(e);try{await saveDoc('driveConfig','main',{...driveCfg(),lastError:drive.error,lastErrorAt:new Date().toISOString()})}catch(_){} }
  finally{drive.running=false;drive.progress='';emit()}
}

    if(c.nodeType===1){
      if(!ALLOWED[c.tagName]){const t=doc.createTextNode(c.textContent);if(/^(SCRIPT|STYLE|IFRAME|OBJECT)$/.test(c.tagName))c.remove();else{walk(c);while(c.firstChild)n.insertBefore(c.firstChild,c);c.remove()}return}
      [...c.attributes].forEach(a=>{if(!(c.tagName==='A'&&a.name==='href'))c.removeAttribute(a.name)});
      if(c.tagName==='A'){const h=c.getAttribute('href')||'';if(!/^(https?:|\/_blob\/)/i.test(h))c.removeAttribute('href');c.setAttribute('target','_blank');c.setAttribute('rel','noopener')}

  return html`<div className="scrim" onMouseDown=${e=>{if(e.target===e.currentTarget)onClose()}}>
    <div className=${'modal'+(wide?' wide':'')} role="dialog" aria-modal="true" aria-label=${title}>

}

/* generic form */
function Field({f,v,set}){
  const id='f-'+f.k;
  let input;
  if(f.type==='textarea')input=html`<textarea className="inp" id=${id} rows=${f.rows||4} value=${v||''} placeholder=${f.ph||''} onInput=${e=>set(e.target.value)}></textarea>`;
  else if(f.type==='select')input=html`<select className="inp" id=${id} value=${v??''} onChange=${e=>set(e.target.value)}>${(f.blank!==false)&&html`<option value="">${f.blank||'—'}</option>`}${f.options.map(o=>html`<option key=${o} value=${o}>${o}</option>`)}</select>`;
  else if(f.type==='course')input=html`<${CourseSelect} id=${id} value=${v} onChange=${set}/>`;
  else if(f.type==='color')input=html`<span className="swatches">${COURSE_PALETTE.map(([h,n])=>html`<button type="button" key=${h} className=${'sw-btn'+(String(v||'').toLowerCase()===h.toLowerCase()?' on':'')} style=${{background:h}} aria-label=${n} title=${n} onClick=${()=>set(h)}></button>`)}<input type="color" id=${id} aria-label="צבע אחר" value=${/^#[0-9a-f]{6}$/i.test(v||'')?v:'#8E877E'} onInput=${e=>set(e.target.value)}/></span>`;
  else if(f.type==='stars')input=html`<${Stars} value=${Number(v)||0} onChange=${set}/>`;
  else if(f.type==='range')input=html`<span className="row"><input type="range" id=${id} min="0" max="100" step="5" value=${v||0} onInput=${e=>set(Number(e.target.value))} style=${{flex:1}}/><span className="num small">${v||0}%</span></span>`;
  else if(f.type==='check')input=html`<span className="row"><input type="checkbox" id=${id} checked=${!!v} onChange=${e=>set(e.target.checked)}/><span className="small" style=${{fontWeight:400,color:'var(--ink)'}}>${f.text||''}</span></span>`;
  else input=html`<input className="inp" id=${id} type=${f.type||'text'} value=${v??''} placeholder=${f.ph||''} dir=${f.type==='url'?'ltr':undefined} onInput=${e=>set(f.type==='number'?(e.target.value===''?'':Number(e.target.value)):e.target.value)}/>`;
  return html`<label className=${'f'+(f.full?' full':'')} htmlFor=${id}>${f.label}${input}${f.hint&&html`<span className="hint">${f.hint}</span>`}</label>`;
}

function RichEditor({value,onChange,ph}){
  const ref=useRef(null);const[link,setLink]=useState(null);const sel=useRef(null);
  useEffect(()=>{if(ref.current&&ref.current.innerHTML!==value)ref.current.innerHTML=value||''},[]);
  const cmd=(c,a)=>{ref.current.focus();document.execCommand(c,false,a);onChange(ref.current.innerHTML)};
  const B=({c,a,t,l})=>html`<button type="button" title=${l} aria-label=${l} onMouseDown=${e=>{e.preventDefault();cmd(c,a)}}>${t}</button>`;
  return html`<div className="editor">
    <div className="tb" role="toolbar" aria-label="עיצוב טקסט">
      <${B} c="formatBlock" a="H2" t="כותרת" l="כותרת"/><${B} c="formatBlock" a="H3" t="משנה" l="כותרת משנה"/><${B} c="formatBlock" a="P" t="רגיל" l="טקסט רגיל"/>
      <span className="sep"></span>
      <${B} c="bold" t=${html`<b>ב</b>`} l="הדגשה"/><${B} c="italic" t=${html`<i>נ</i>`} l="נטוי"/><${B} c="underline" t=${html`<u>ק</u>`} l="קו תחתון"/>
      <span className="sep"></span>
      <${B} c="insertUnorderedList" t="• רשימה" l="רשימת תבליטים"/><${B} c="insertOrderedList" t="1. רשימה" l="רשימה ממוספרת"/><${B} c="formatBlock" a="BLOCKQUOTE" t="ציטוט" l="ציטוט"/>
      <span className="sep"></span>
      <button type="button" onMouseDown=${e=>{e.preventDefault();const s=window.getSelection();sel.current=s.rangeCount?s.getRangeAt(0).cloneRange():null;setLink('https://')}}>קישור</button>
      <${B} c="removeFormat" t="ניקוי" l="ניקוי עיצוב"/>
    </div>
    ${link!==null&&html`<div className="row" style=${{padding:'8px'}}><input className="inp" dir="ltr" id="link-url" value=${link} onInput=${e=>setLink(e.target.value)} style=${{flex:1}}/><button type="button" className="btn sm pri" onClick=${()=>{const s=window.getSelection();ref.current.focus();if(sel.current){s.removeAllRanges();s.addRange(sel.current)}if(/^https?:\/\/.+/.test(link)){if(s.isCollapsed)document.execCommand('insertHTML',false,'<a href="'+link.replace(/"/g,'%22')+'">'+link.replace(/</g,'&lt;')+'</a>');else document.execCommand('createLink',false,link)}onChange(ref.current.innerHTML);setLink(null)}}>הוספה</button><button type="button" className="btn sm" onClick=${()=>setLink(null)}>ביטול</button></div>`}
    <div className="ce prose" ref=${ref} contentEditable="true" role="textbox" aria-multiline="true" aria-label="תוכן הסיכום" data-ph=${ph||''} onInput=${e=>onChange(e.currentTarget.innerHTML)}></div>
  </div>`;
}

        ${selIt.lessons.map(l=>html`<div key=${l.id} className="li"><span className="num small muted" style=${{minWidth:'90px'}}>${hm(l.start,l.end)}</span><div className="grow"><${CourseTag} id=${l.courseId}/>${l.label?' · '+l.label:''} <span className="xs muted">${l.room} · ${l.code}</span></div><span className="chip">${lessonStatus(l)}</span><a className="btn sm ghost" href=${'#'+lessonHash(l)}>פתיחה</a></div>`)}
        ${selIt.events.map(e=>html`<div key=${e.id} className="li"><span className="num small muted" style=${{minWidth:'90px'}}>${e.start||e.type}</span><div className="grow">${e.title}${e.notes&&html`<div className="xs muted">${e.notes}</div>`}</div><button className="btn sm ghost" onClick=${()=>editEvent(e)}>עריכה</button></div>`)}

function CalendarIO(){
  const st=useStore();const[msg,setMsg]=useState('');const[pending,setPending]=useState(null);
  const exportCsv=async()=>{
    const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';const us=d=>{const[y,m,dd]=d.split('-');return m+'/'+dd+'/'+y};
    const rows=[['Subject','Start Date','Start Time','End Date','End Time','All Day Event','Description','Location']];
    allLessons().filter(l=>l.status!=='בוטל').forEach(l=>rows.push([courseName(l.courseId)+(l.label?' – '+l.label:''),us(l.date),l.start,us(l.date),l.end,'False',(l.topic||'')+' '+l.code,l.room]));
    st.data.events.forEach(e=>rows.push([e.title,us(e.date),e.start||'',us(e.endDate||e.date),e.end||'',e.start?'False':'True',e.notes||'',e.location||'']));
    st.data.assignments.filter(a=>a.due).forEach(a=>rows.push(['הגשה: '+a.title,us(a.due),'',us(a.due),'','True',courseName(a.courseId),'']));
    const csv='﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
    if(!st.downloads){setMsg('ייצוא קבצים זמין כשהמחברת פתוחה ב־Claude.');return}
    try{await st.downloads.save({filename:'maaleh-calendar.csv',data:csv});setMsg('הקובץ נשמר. ב־Google Calendar: הגדרות ← ייבוא וייצוא ← ייבוא.')}catch(e){setMsg(e&&e.code==='declined'?'השמירה בוטלה.':'השמירה לא הצליחה.')}
  };
  const importIcs=async e=>{const f=e.target.files[0];if(!f)return;const txt=await f.text();e.target.value='';
    const un=txt.replace(/\r?\n[ \t]/g,'');const evs=[];un.split('BEGIN:VEVENT').slice(1).forEach(b=>{const g=k=>{const m=b.match(new RegExp('^'+k+'(?:;[^:\\n]*)?:(.*)$','m'));return m?m[1].trim():''};
      const ds=g('DTSTART'),de=g('DTEND');if(!ds)return;const d=ds.slice(0,4)+'-'+ds.slice(4,6)+'-'+ds.slice(6,8);const tm=ds.length>8?ds.slice(9,11)+':'+ds.slice(11,13):'';
      let ed='';if(de){ed=de.slice(0,4)+'-'+de.slice(4,6)+'-'+de.slice(6,8);if(!tm)ed=addDays(ed,-1);if(ed===d)ed=''}
      const te=de&&de.length>8?de.slice(9,11)+':'+de.slice(11,13):'';
      const un2=s=>s.replace(/\\n/g,'\n').replace(/\\,/g,',').replace(/\\;/g,';');
      evs.push({title:un2(g('SUMMARY'))||'אירוע',date:d,endDate:ed,start:tm,end:te,location:un2(g('LOCATION')),notes:un2(g('DESCRIPTION')).slice(0,500),type:'אישי',uid:g('UID')})});
    if(!evs.length){setMsg('לא נמצאו אירועים בקובץ.');return}
    const known=new Set(st.data.events.map(x=>x.uid).filter(Boolean));const fresh=evs.filter(x=>!x.uid||!known.has(x.uid));
    setPending(fresh);setMsg('נמצאו '+evs.length+' אירועים'+(evs.length-fresh.length?', מתוכם '+(evs.length-fresh.length)+' כבר קיימים':'')+'.')};
  return html`<div className="card stack">
    <h3 style=${{margin:0}}>ייבוא וייצוא</h3>
    <p className="small muted">ייצוא של כל השיעורים, האירועים ומועדי ההגשה לקובץ CSV שאפשר לייבא ל־Google Calendar. ייבוא של קובץ ‎.ics‎ מכל יומן מוסיף את האירועים כאירועים אישיים.</p>
    <div className="row">
      <button className="btn" onClick=${exportCsv} disabled=${!st.downloads}>ייצוא ליומן (CSV)</button>
      <label className="btn" htmlFor="ics-in">ייבוא קובץ ‎.ics<input id="ics-in" type="file" accept=".ics,text/calendar" hidden onChange=${importIcs}/></label>
    </div>
    ${!st.downloads&&html`<span className="hint">ייצוא קבצים זמין כשהמחברת פתוחה ב־Claude.</span>`}
    ${msg&&html`<p className="small">${msg}</p>`}
    ${pending&&pending.length>0&&html`<div className="row"><button className="btn pri sm" onClick=${async()=>{for(const ev of pending)await saveDoc('events',newId('ev'),{...ev,origin:'mine'});setMsg('נוספו '+pending.length+' אירועים.');setPending(null)}}>להוסיף ${pending.length} אירועים</button><button className="btn sm" onClick=${()=>{setPending(null);setMsg('')}}>ביטול</button></div>`}
  </div>`;
}
